<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrare - Killer SRL</title>
    <meta name="mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mentenanță">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    
 <style>
        :root {
            --primary: #2c3e50;
            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --text: #ecf0f1;
            --text-dim: #bdc3c7;
        }

        /* --- STILURI DE BAZĂ (PC) --- */
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: row;
            height: 100vh;
            background: #1a1a1a; color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Harta ocupă acum mereu fundalul */
        #map {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #222; z-index: 1;
        }
        .leaflet-container { cursor: crosshair !important; }

        /* Panoul din stânga - ASCUNS INIȚIAL PE PC */
        #sidebar {
            display: none; /* Aici este magia: e ascuns din start */
            position: relative;
            width: 420px; min-width: 420px;
            height: 100vh;
            background: var(--primary);
            padding: 25px;
            overflow-y: auto;
            box-sizing: border-box;
            flex-direction: column;
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .drag-handle { display: none; }

        /* --- MENIU PLUTITOR PE HARTĂ (NOU) --- */
        .floating-menu {
            position: absolute; top: 20px; right: 20px;
            z-index: 1000;
            display: flex; gap: 15px;
        }
        .float-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(44, 62, 80, 0.9); color: white; 
            border: 2px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 22px; cursor: pointer;
            backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .float-btn:hover { transform: scale(1.1); background: var(--primary); }
        .float-btn.btn-add { background: var(--accent); color: black; border-color: var(--accent); }

        /* Status Cloud Plutitor */
        .cloud-status {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(39, 174, 96, 0.9); color: white;
            padding: 10px 20px; border-radius: 20px; font-size: 11px;
            display: flex; align-items: center; gap: 8px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
        }
        .cloud-status.offline { background: rgba(231, 76, 60, 0.9); }
        .dot { width: 7px; height: 7px; background: white; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        /* Buton de închidere panou pe PC */
        .btn-inchide-pc {
            background: rgba(231, 76, 60, 0.1); color: #e74c3c;
            border: 1px solid #e74c3c; padding: 15px; border-radius: 8px;
            cursor: pointer; font-weight: bold; margin-bottom: 20px;
            width: 100%; transition: 0.3s; font-size: 12px;
        }
        .btn-inchide-pc:hover { background: #e74c3c; color: white; }

        /* --- STILURI PENTRU MOBIL (Sub 768px) --- */
        @media (max-width: 768px) {
            body { overflow: hidden; } 
            
            #sidebar {
                position: fixed !important;
                bottom: 0 !important; 
                transform: translateY(150%); /* Ascuns sub ecran */
                left: 0; width: 100% !important; max-height: 85vh;
                z-index: 1000;
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
                transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex !important;
                padding: 10px 20px 20px 20px !important;
            }

            #sidebar.panou-deschis { transform: translateY(0); }
            #sidebar.panou-deschis.minimizat { transform: translateY(calc(100% - 50px)); }

            .drag-handle {
                display: flex; flex-direction: column; align-items: center;
                width: 100%; padding-bottom: 10px; cursor: pointer;
            }
            .drag-handle .bar {
                width: 50px; height: 5px; background: rgba(255,255,255,0.4);
                border-radius: 5px; margin-bottom: 5px;
            }
            .drag-handle span { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; }

            .btn-inchide-pc { display: none; } /* Ascundem butonul roșu pe mobil */
            
            .floating-menu {
                top: auto; bottom: 30px; right: 15px;
                flex-direction: column; /* Le punem una sub alta în colț */
            }
            .cloud-status { top: 15px; padding: 8px 15px; }
        }

        /* Restul elementelor UI din formular */
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { max-width: 120px; }
        
        #form-container { display: none; background: transparent; }

        .status-badge { padding: 12px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-bottom: 15px; text-align: center; border-left: 5px solid var(--accent); background: rgba(0,0,0,0.2); }
        .status-edit { border-left-color: #3498db; color: #3498db; }

        .group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }

        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; font-size: 13px; box-sizing: border-box; outline: none; font-family: inherit; }
        textarea { resize: vertical; }
        select option { background: #2c3e50; color: white; }

        .checklist { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-top: 5px; border: 1px dashed rgba(255,255,255,0.1); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 11px; cursor: pointer; }
        .check-item input { width: auto; margin: 0; }

        .btn-save { background: var(--success); color: white; padding: 18px; border: none; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        .btn-save:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-del { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-size: 11px; margin-top: 15px; }

        .msg-popup { padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 12px; font-weight: bold; text-align: center; display: none; }
        .msg-success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #27ae60; }
        .msg-error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #c0392b; }

        .custom-pin svg { filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3)); shape-rendering: geometricPrecision; }
        .pin-selectat svg { filter: drop-shadow(0 0 10px #3498db) drop-shadow(0 0 15px #3498db) !important; transform: scale(1.2); transition: all 0.3s ease; }
        .pin-selectat path { stroke: #3498db !important; stroke-width: 2.5px !important; }
    </style>
</head>

<body>

<div class="cloud-status">
    <div class="dot"></div> CLOUD ONLINE
</div>

<div class="floating-menu">
    <a href="index.html" class="float-btn" title="Înapoi la Portal">🏠</a>
    <a href="view.html" class="float-btn" title="Vizualizare">👁️</a>
    <button class="float-btn btn-add" onclick="deschideAdaugare()" title="Adaugă Utilaj">➕</button>
</div>

<div id="map"></div>

<div id="sidebar">
    
    <div id="drag-handle" class="drag-handle">
    <div class="bar"></div>
    <button onclick="toggleMinimize()" style="background: var(--accent); border: none; border-radius: 20px; padding: 5px 15px; font-size: 10px; font-weight: bold; margin-top: 5px; cursor: pointer;">
        ⬇️ ASCUNDE / ⬆️ ARATĂ HARTA
    </button>
</div>

    <button class="btn-inchide-pc" onclick="resetForm()">❌ ÎNCHIDE PANOUL PENTRU A VEDEA HARTA</button>

    <div class="logo-box">
        <img src="logo.png" alt="Logo">
    </div>
    
    <div id="form-container">
        <div id="status" class="status-badge">MOD: UTILAJ NOU</div>

        <div class="group" id="grup-punere-functiune">
            <label>Data Punere în Funcțiune (Fixă)</label>
            <input type="date" id="data-punere">
        </div>

        <div class="group">
            <label>Denumire Utilaj</label>
            <input type="text" id="nume" placeholder="Ex: Cuter Seydelmann 330L" oninput="checkReady()">
        </div>
        
        <div class="group">
            <label>Model / Serie</label>
            <input type="text" id="model" placeholder="Ex: SN 16400-1">
        </div>
        
        <div class="group">
            <label>Secție</label>
            <select id="sectie" onchange="toggleExtra()">
                <option value="Tranșare">Tranșare</option>
                <option value="Injectare">Injectare</option>
                <option value="Tocare">Tocare</option>
                <option value="Fabricație">Fabricație</option>
                <option value="Tratament Termic">Tratament Termic (Celule)</option>
                <option value="Secție Crude">Secție Crude</option>
                <option value="Ambalare Vid">Ambalare Vid</option>
                <option value="Livrare">Livrare (Cântare)</option>
                <option value="Depozitare">Depozitare (Frig)</option>
            </select>
        </div>

        <div class="group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label>Data</label>
                <input type="date" id="data">
            </div>
            <div>
                <label>Tip Intervenție</label>
                <select id="tipInterventie">
                    <option value="Mentenanță Preventivă">Preventivă (Plan)</option>
                    <option value="Mentenanță Corectivă">Corectivă (Defect)</option>
                    <option value="Inspecție Vizuală">Inspecție Săptămânală</option>
                </select>
            </div>
        </div>
        
        <div class="group" style="background: rgba(46, 204, 113, 0.1); border: 1px solid rgba(46, 204, 113, 0.3); padding: 12px; border-radius: 8px;">
            <label class="check-item" style="color: #2ecc71; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="esteRevizie" style="width: 18px; height: 18px; cursor: pointer;">
                BIFEAZĂ DACĂ ACEASTA ESTE O REVIZIE SAU MENTENANȚĂ PREVENTIVĂ
            </label>
        </div>

        <div class="group" style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
            <div>
                <label>Efectuat de (Mecanic):</label>
                <input type="text" id="mecanic" placeholder="Nume mecanic...">
            </div>
        </div>

        <div id="extraFields"></div>

        <div class="group">
            <label>Observații / Piese înlocuite</label>
            <textarea id="obs" rows="3" placeholder="Ex: Înlocuit ulei Shell Tellus 90..."></textarea>
        </div>
        
        <div class="group">
            <label>📸 FOTOGRAFIE DEFECT / REPARAȚIE</label>
            <input type="file" id="fotoUtilaj" accept="image/*" capture="environment" style="padding: 10px;">
        </div>
        
        <button class="btn-save" id="saveBtn" onclick="verificareSalvare()" disabled>💾 SALVEAZĂ FIȘA</button>
        <div id="feedbackMsg" class="msg-popup"></div>
        <div id="deleteZone"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBHfyZzJ-GUfUUqEidMytaCSh-B2SYh1Ks",
        authDomain: "killer-mentenanta.firebaseapp.com",
        databaseURL: "https://killer-mentenanta-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "killer-mentenanta",
        storageBucket: "killer-mentenanta.firebasestorage.app",
        messagingSenderId: "434460062600",
        appId: "1:434460062600:web:38a2ff00266c3c1dff403d"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    firebase.auth().onAuthStateChanged((user) => {
        if (!user) { window.location.href = "index.html"; }
    });

    var map = L.map('map', { crs: L.CRS.Simple, minZoom: 0, maxZoom: 3, zoomControl: false });
    // Adaugăm butoanele de zoom jos în stânga (ca să nu se bată cu meniul nostru)
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    L.imageOverlay('harta.jpg', [[0, 0], [1000, 1400]]).addTo(map);
    map.setView([500, 700], 1); 

    let dbRaw = {};
    let markersGroup = L.layerGroup().addTo(map);
    let activeMarker = null;
    let selectedId = null;
    let currentCoords = null;
    
    function calculeazaZile(dataString) {
        if (!dataString || dataString === "-") return 999; 
        let dt = new Date(dataString);
        if (isNaN(dt)) {
            const p = dataString.split(/[./-]/);
            if (p.length === 3) dt = new Date(p[2], p[1]-1, p[0]);
        }
        const azi = new Date(); azi.setHours(0,0,0,0);
        const diff = Math.floor((azi - dt) / 86400000);
        return diff < 0 ? 0 : diff;
    }
    
    document.getElementById('data').valueAsDate = new Date();

    database.ref('utilaje').on('value', (snap) => { 
        dbRaw = snap.val() || {}; 
        refreshPini(); 

        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id');
        if (qrId && dbRaw[qrId] && selectedId !== qrId) { incarcaUtilaj(qrId); }
    });

    function refreshPini() {
        markersGroup.clearLayers();
        Object.keys(dbRaw).forEach(id => {
            const u = dbRaw[id];
            if (u.lat && u.lng) {
                let col = "#2ecc71"; 
                if (u.istoric) {
                    const istArr = Object.values(u.istoric);
                    const ultimaRev = istArr.find(i => i.revizie === true);
                    if (ultimaRev) {
                        const z = calculeazaZile(ultimaRev.data); 
                        col = z < 30 ? "#2ecc71" : (z < 90 ? "#f39c12" : "#e74c3c");
                    }
                }

                const esteSelectat = (id === selectedId);
                const clasaPin = esteSelectat ? 'custom-pin pin-selectat' : 'custom-pin';
                const customIcon = L.divIcon({ 
                    className: clasaPin, 
                    html: `
                        <svg width="30" height="45" viewBox="0 0 30 45" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="15" cy="42" rx="7" ry="2" fill="rgba(0,0,0,0.15)" />
                            <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 30 15 30s15-19.5 15-30c0-8.3-6.7-15-15-15z" fill="${col}" stroke="#fff" stroke-width="0.5"/>
                            <circle cx="15" cy="15" r="5.5" fill="white"/>
                        </svg>`,
                    iconSize: [30, 45], iconAnchor: [15, 45], popupAnchor: [0, -45]
                });
                
                const m = L.marker([u.lat, u.lng], { icon: customIcon, zIndexOffset: esteSelectat ? 1000 : 0 }).addTo(markersGroup);
                m.on('click', (e) => { L.DomEvent.stopPropagation(e); incarcaUtilaj(id); });
            }
        });
    }
   
    map.on('click', (e) => {
        resetForm(); // Ascunde ce era înainte
        
        currentCoords = [e.latlng.lat.toFixed(0), e.latlng.lng.toFixed(0)];
        if (activeMarker) map.removeLayer(activeMarker);
        activeMarker = L.marker(e.latlng).addTo(map); 
        
        // AFIȘEAZĂ PANOUL
        document.getElementById('sidebar').style.display = 'flex'; // Pentru PC
        document.getElementById('form-container').style.display = 'block';
        document.getElementById('sidebar').classList.add('panou-deschis'); // Pentru Mobil
        document.getElementById('sidebar').classList.remove('minimizat');
        document.getElementById('data-punere').disabled = false;
        
        setTimeout(() => { map.invalidateSize(); }, 400);
        checkReady();
    });

    function incarcaUtilaj(id) {
        selectedId = id; const u = dbRaw[id];

        // AFIȘEAZĂ PANOUL
        document.getElementById('sidebar').style.display = 'flex'; // Pentru PC
        document.getElementById('form-container').style.display = 'block';
        document.getElementById('sidebar').classList.add('panou-deschis'); // Pentru Mobil
        document.getElementById('sidebar').classList.remove('minimizat');
        
        setTimeout(() => { map.invalidateSize(); }, 400);
        
        const campPunere = document.getElementById('data-punere');
        if (u.dataPunere) { campPunere.value = u.dataPunere; campPunere.disabled = true; } 
        else { campPunere.value = ""; campPunere.disabled = false; }

        document.getElementById('nume').value = u.nume; 
        document.getElementById('model').value = u.model || ""; 
        document.getElementById('sectie').value = u.sectie;
        document.getElementById('status').innerHTML = `MOD: EDITARE UTILAJ (ID: ${id})`; 
        document.getElementById('status').className = "status-badge status-edit";
        
        const deleteBtnHtml = `<button class="btn-del" onclick="executCuProtectie(() => stergeUtilaj('${id}'))">⚠️ ȘTERGE UTILAJ DEFINITIV</button>`;
        document.getElementById('deleteZone').innerHTML = deleteBtnHtml;
        
        if (activeMarker) map.removeLayer(activeMarker);
        
        toggleExtra(); checkReady(); refreshPini();
    }

    function deschideAdaugare() {
        executCuProtectie(() => {
            resetForm();
            document.getElementById('sidebar').style.display = 'flex'; // Deschide pe PC
            document.getElementById('form-container').style.display = 'block';
            document.getElementById('sidebar').classList.add('panou-deschis'); // Deschide pe mobil
            document.getElementById('sidebar').classList.remove('minimizat');
            document.getElementById('data-punere').disabled = false;
            setTimeout(() => { map.invalidateSize(); }, 400);
        });
    }

    function toggleExtra() {
        const s = document.getElementById('sectie').value;
        const extraFieldsDiv = document.getElementById('extraFields');
        let html = '<label>Operațiuni Plan Mentenanță 2026:</label><div class="checklist">';

        if (s === 'Tocare' || s === 'Injectare' || s === 'Fabricație') {
            html += `<label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Hidraulic"> Schimb Ulei Hidraulic</label>
                     <label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Vacuum"> Schimb Ulei Pompă Vacuum</label>
                     <label class="check-item"><input type="checkbox" class="task" value="Filtre Aer/Ulei"> Verificare/Schimb Filtre</label>`;
        } else if (s === 'Tratament Termic') {
            html += `<label class="check-item"><input type="checkbox" class="task" value="Curatare Tubulatura"> Curățare Tubulatură</label>
                     <label class="check-item"><input type="checkbox" class="task" value="Sonda Temp"> Calibrare Sondă</label>`;
        } else {
            html += `<label class="check-item"><input type="checkbox" class="task" value="Inspectie Vizuala"> Inspecție Vizuală Generală</label>
                     <label class="check-item"><input type="checkbox" class="task" value="Gresare Generala"> Gresare Componente</label>`;
        }
        
        html += `</div><div class="group" style="margin-top:10px;">
                 <label>Altă operațiune manuală (Piese înlocuite):</label>
                 <textarea id="extraCheck" rows="3" placeholder="Ex: Înlocuit rulment 6205..."></textarea></div>`;
        extraFieldsDiv.innerHTML = html;
    }

    function checkReady() {
        const numeValid = document.getElementById('nume').value.trim().length > 2;
        const areLocatie = (selectedId !== null) || (currentCoords !== null);
        document.getElementById('saveBtn').disabled = !(areLocatie && numeValid);
    }

    async function stergeUtilaj(id) { 
        if (confirm("Ești sigur că vrei să ștergi acest utilaj și întregul său istoric?")) { 
            await database.ref('utilaje/' + id).remove(); resetForm(); 
        } 
    }

    async function salveaza() {
        const btn = document.getElementById('saveBtn'); const msg = document.getElementById('feedbackMsg');
        const file = document.getElementById('fotoUtilaj').files[0]; const esteOnline = navigator.onLine;

        btn.disabled = true; btn.innerText = (file && esteOnline) ? "⏳ SE ÎNCARCĂ POZA..." : "⏳ SE SALVEAZĂ...";

        try {
            const bifeValues = Array.from(document.querySelectorAll('.task:checked')).map(c => c.value);
            let verificariFinale = bifeValues.join(", ");
            const manual = document.getElementById('extraCheck') ? document.getElementById('extraCheck').value : "";
            if (manual !== "") verificariFinale = verificariFinale ? verificariFinale + " | " + manual : manual;

            const finalId = selectedId ? selectedId : "K-" + Math.floor(1000 + Math.random() * 9000);
            let fortamOffline = false; 

            const entry = {
                data: document.getElementById('data').value, tip: document.getElementById('tipInterventie').value,
                mecanic: document.getElementById('mecanic').value, verificari: verificariFinale,
                obs: document.getElementById('obs').value, timestamp: Date.now(),
                revizie: document.getElementById('esteRevizie').checked, foto: "" 
            };

            if (esteOnline) {
                const ruleazaFirebase = (promisiune) => Promise.race([ promisiune, new Promise((_, r) => setTimeout(() => r(new Error("TIMEOUT")), 8000)) ]);
                try {
                    if (file) {
                        const snap = await ruleazaFirebase(firebase.storage().ref('mentenanta/' + Date.now() + "_" + file.name).put(file));
                        entry.foto = await snap.ref.getDownloadURL();
                    }
                    if (selectedId) {
                        await ruleazaFirebase(database.ref('utilaje/' + finalId + '/istoric').push(entry));
                        await ruleazaFirebase(database.ref('utilaje/' + finalId + '/model').set(document.getElementById('model').value));
                        await ruleazaFirebase(database.ref('utilaje/' + finalId + '/sectie').set(document.getElementById('sectie').value));
                        const d = document.getElementById('data-punere').value;
                        if(d) await ruleazaFirebase(database.ref('utilaje/' + finalId + '/dataPunere').set(d));
                        if(entry.foto) await ruleazaFirebase(database.ref('utilaje/' + finalId + '/imagine').set(entry.foto));
                    } else {
                        await ruleazaFirebase(database.ref('utilaje/' + finalId).set({
                            id: finalId, nume: document.getElementById('nume').value, model: document.getElementById('model').value, sectie: document.getElementById('sectie').value,
                            lat: parseFloat(currentCoords[0]), lng: parseFloat(currentCoords[1]), dataPunere: document.getElementById('data-punere').value, imagine: entry.foto, istoric: { "init": entry }
                        }));
                    }
                    msg.innerText = "✅ SALVAT CU SUCCES!"; msg.className = "msg-popup msg-success";
                } catch (err) { if (err.message === "TIMEOUT") fortamOffline = true; else throw err; }
            }

            if (!esteOnline || fortamOffline) {
                let coada = JSON.parse(localStorage.getItem('coada_sincronizare')) || [];
                coada.push({ isNew: !selectedId, id: finalId, nume: document.getElementById('nume').value, model: document.getElementById('model').value, sectie: document.getElementById('sectie').value, lat: currentCoords ? parseFloat(currentCoords[0]) : null, lng: currentCoords ? parseFloat(currentCoords[1]) : null, entryData: entry });
                localStorage.setItem('coada_sincronizare', JSON.stringify(coada));
                msg.innerText = "⚠️ SALVAT PE TELEFON (OFFLINE)!"; msg.className = "msg-popup msg-error"; msg.style.borderColor = "#f39c12"; msg.style.color = "#f39c12";
            }

            msg.style.display = "block";
            setTimeout(() => { resetForm(); btn.innerText = "💾 SALVEAZĂ FIȘA"; btn.disabled = false; msg.style.display = "none"; }, 3000);

        } catch (e) {
            msg.innerText = "❌ EROARE: " + e.message; msg.className = "msg-popup msg-error"; msg.style.display = "block";
            btn.disabled = false; btn.innerText = "💾 ÎNCEARCĂ DIN NOU";
        }
    }

    function resetForm() {
        selectedId = null; 
        currentCoords = null;
        
        // ASCUNDE TOT
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('sidebar').style.display = 'none'; // Pe PC
        document.getElementById('sidebar').classList.remove('panou-deschis'); // Pe Mobil
        document.getElementById('sidebar').classList.remove('minimizat');
        
        setTimeout(() => { map.invalidateSize(); }, 400);
        
        document.getElementById('nume').value = ""; 
        document.getElementById('model').value = ""; 
        document.getElementById('obs').value = ""; 
        document.getElementById('mecanic').value = "";
        document.getElementById('data-punere').value = ""; 
        document.getElementById('data-punere').disabled = false;
        document.getElementById('status').innerHTML = "MOD: UTILAJ NOU"; 
        document.getElementById('status').className = "status-badge"; 
        document.getElementById('deleteZone').innerHTML = ""; 
        document.getElementById('fotoUtilaj').value = "";
        
        if (activeMarker) map.removeLayer(activeMarker); 
        refreshPini(); 
        toggleExtra(); 
        checkReady();
    }

    window.onload = () => { setTimeout(() => { map.invalidateSize(); }, 500); };

    function executCuProtectie(functieDeExecutat) {
        if (!navigator.onLine) { functieDeExecutat(); return; }
        const parolaConfirmare = prompt("Introdu parola de Administrator:");
        if (!parolaConfirmare) return; 
        const user = firebase.auth().currentUser;
        if (!user) return alert("❌ Nu ești logat.");
        
        const btn = document.getElementById('saveBtn'); if (btn) btn.innerText = "⏳ VERIFICARE...";
        user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, parolaConfirmare))
            .then(() => functieDeExecutat())
            .catch(() => { alert("❌ Parolă incorectă!"); if (btn) { btn.innerText = "💾 SALVEAZĂ FIȘA"; btn.disabled = false; } });
    }

    function verificareSalvare() { if (!selectedId) executCuProtectie(salveaza); else salveaza(); }

    function updateConnectionStatus() {
        const cloudBanner = document.querySelector('.cloud-status');
        if (navigator.onLine) {
            cloudBanner.classList.remove('offline'); 
            cloudBanner.innerHTML = '<div class="dot"></div> CLOUD ONLINE'; 
            sincronizeazaDatele(); 
        } else {
            cloudBanner.classList.add('offline'); 
            cloudBanner.innerHTML = '⚠️ OFFLINE - SALVĂM LOCAL';
        }
    }

    async function sincronizeazaDatele() {
        let coada = JSON.parse(localStorage.getItem('coada_sincronizare')) || [];
        if (coada.length === 0) return; 
        for (let item of coada) {
            try {
                if (item.isNew) await database.ref('utilaje/' + item.id).set({ id: item.id, nume: item.nume, model: item.model, sectie: item.sectie, lat: item.lat, lng: item.lng, istoric: { "init": item.entryData } });
                else {
                    await database.ref('utilaje/' + item.id + '/istoric').push(item.entryData);
                    await database.ref('utilaje/' + item.id + '/model').set(item.model);
                    await database.ref('utilaje/' + item.id + '/sectie').set(item.sectie);
                }
            } catch (error) { return; }
        }
        localStorage.removeItem('coada_sincronizare'); alert("✅ Sincronizat în Cloud!");
    }
    
    window.addEventListener('online', updateConnectionStatus); 
    window.addEventListener('offline', updateConnectionStatus); 
    updateConnectionStatus(); 

    // ====== LOGICĂ GLISARE MOBIL ======
    const dragHandle = document.getElementById('drag-handle'); 
    const sidebar = document.getElementById('sidebar');
    let touchStartY = 0;
    if (dragHandle && sidebar) {
        dragHandle.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, {passive: true});
        dragHandle.addEventListener('touchend', (e) => {
            const dif = e.changedTouches[0].clientY - touchStartY;
            if (dif > 30) sidebar.classList.add('minimizat');
            else if (dif < -30) sidebar.classList.remove('minimizat');
            else sidebar.classList.toggle('minimizat');
        });
        dragHandle.addEventListener('click', () => sidebar.classList.toggle('minimizat'));
    }
    function toggleMinimize() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('minimizat');
    // Forțăm harta să se repare imediat ce mutăm panoul
    setTimeout(() => { map.invalidateSize(); }, 300);
}
</script>
</body>
