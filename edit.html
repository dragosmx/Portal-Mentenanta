            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --text: #ecf0f1;
            --text-dim: #bdc3c7;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            height: 100vh;
            background: #1a1a1a;
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #222;
            z-index: 1;
        }

        .leaflet-container {
            cursor: crosshair !important;
        }

        #sidebar {
            display: none;
            position: relative;
            width: 420px;
            min-width: 420px;
            height: 100vh;
            background: var(--primary);
            padding: 25px;
            overflow-y: auto;
            box-sizing: border-box;
            flex-direction: column;
            z-index: 10;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .drag-handle {
            display: none;
        }

        /* ---------------------------------------------------
           MENIU PLUTITOR (DREAPTA JOS/SUS)
           --------------------------------------------------- */
        .floating-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 15px;
        }

        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(44, 62, 80, 0.9);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 22px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .float-btn:hover {
            transform: scale(1.1);
            background: var(--primary);
        }

        /* ---------------------------------------------------
           BUTOANE CENTRALE SUS (CLOUD + ADMIN)
           --------------------------------------------------- */
        .top-status-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cloud-status,
        .admin-status-btn {
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }

        .cloud-status {
            background: rgba(39, 174, 96, 0.9);
        }

        .cloud-status.offline {
            background: rgba(231, 76, 60, 0.9);
        }

        .admin-status-btn {
            background: rgba(231, 76, 60, 0.8);
            cursor: pointer;
            transition: 0.2s;
            outline: none;
        }

        .admin-status-btn:active {
            transform: scale(0.95);
        }

        .dot {
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.4;
            }
        }

        .btn-inchide-pc {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
            transition: 0.3s;
            font-size: 12px;
        }

        .btn-inchide-pc:hover {
            background: #e74c3c;
            color: white;
        }

           --------------------------------------------------- */
        @media (max-width: 768px) {
            body {

            }

        var map = L.map('map', { crs: L.CRS.Simple, minZoom: 0, maxZoom: 3, zoomControl: false });

        // --- START TRADUCĂTOR DATE ---
        function obtineTimp(dataString) {
            if (!dataString || dataString === "-" || dataString.trim() === "") return 0;
            const curat = dataString.replace(/[^0-9./-]/g, '').trim();
            const part = curat.split(/[./-]/);
            if (part.length < 3) return 0;

            let d, m, y;
            if (part[0].length === 4) { [y, m, d] = part; } else { [d, m, y] = part; }

            return new Date(y, m - 1, d).getTime();
        }

        function calculeazaZile(dataString) {
            const timp = obtineTimp(dataString);
            if (timp === 0) return 999;
            const dt = new Date(timp);
            const azi = new Date(); azi.setHours(0, 0, 0, 0);
            const diff = Math.floor((azi - dt) / 86400000);
            return isNaN(diff) ? 999 : (diff < 0 ? 0 : diff);
        }

        function gasesteUltimaRevizie(istoric) {
            if (!istoric) return null;
            let revizii = Object.values(istoric).filter(i => i.revizie === true);
            if (revizii.length === 0) return null;

            revizii.sort((a, b) => obtineTimp(b.data) - obtineTimp(a.data));
            return revizii[0];
        }

            Object.keys(dbRaw).forEach(id => {
                const u = dbRaw[id];
                if (u.lat && u.lng) {
                    const nume = (u.nume || "").toLowerCase();
                    const cod = (id || "").toLowerCase();
                    const sectie = (u.sectie || "").toLowerCase();
                    const model = (u.model || "").toLowerCase();

                    // 🪄 MAGIC: Verificăm dacă utilajul curent se potrivește cu textul din bara de căutare
                    if (textCautat === "" || nume.includes(textCautat) || cod.includes(textCautat) || sectie.includes(textCautat) || model.includes(textCautat)) {

                        /*let col = "#2ecc71"; 
                        if (u.istoric) {
                            const istArr = Object.values(u.istoric);
                            const ultimaRev = istArr.find(i => i.revizie === true);
                            if (ultimaRev) {
                                const z = calculeazaZile(ultimaRev.data); 
                                col = z < 30 ? "#2ecc71" : (z < 90 ? "#f39c12" : "#e74c3c");
                            }
                        }*/
                        // --- CULORI INTELIGENTE 14/30 ZILE ---
                        let col = "#2ecc71"; // Presupunem verde
                        const configuratieAlarme = { "9728": 30, "6355": 30, "1111": 14, "2222": 14, "3333": 14, "4444": 14, "5061": 14 };
                        const ultimaRev = gasesteUltimaRevizie(u.istoric);

                        if (ultimaRev) {
                            const limitaZile = configuratieAlarme[id] || configuratieAlarme[id.replace("K-", "")] || 30;
                            const z = calculeazaZile(ultimaRev.data);

                            if (z >= limitaZile && z < (limitaZile * 3)) col = "#f39c12"; // Portocaliu
                            else if (z >= (limitaZile * 3)) col = "#e74c3c"; // Roșu critic
                        } else if (u.istoric) {
                            // Dacă are istoric dar nu are revizie
                            col = "#e74c3c";
                        }

                        const esteSelectat = (id === selectedId);
                        const clasaPin = esteSelectat ? 'custom-pin pin-selectat' : 'custom-pin';
                        const customIcon = L.divIcon({
                            className: clasaPin,
                            html: `
                            <svg width="30" height="45" viewBox="0 0 30 45" xmlns="http://www.w3.org/2000/svg">
                                <ellipse cx="15" cy="42" rx="7" ry="2" fill="rgba(0,0,0,0.15)" />
                                <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 30 15 30s15-19.5 15-30c0-8.3-6.7-15-15-15z" fill="${col}" stroke="#fff" stroke-width="0.5"/>
                                <circle cx="15" cy="15" r="5.5" fill="white"/>
                            </svg>`,
                            iconSize: [30, 45], iconAnchor: [15, 45], popupAnchor: [0, -45]
                        });

                        const m = L.marker([u.lat, u.lng], { icon: customIcon, zIndexOffset: esteSelectat ? 1000 : 0 }).addTo(markersGroup);
                        m.on('click', (e) => { L.DomEvent.stopPropagation(e); incarcaUtilaj(id); });
                    }
                }
            });
        }

        // 📋 GENERARE ȘI FILTRARE LISTĂ SIDEBAR PENTRU VIZUALIZARE TIP LISTĂ
        function actualizeazaListaSidebar() {
            const textCautat = document.getElementById('searchBar').value.toLowerCase().trim();
            const corpLista = document.getElementById('corpListaSidebar');
            corpLista.innerHTML = "";

            Object.keys(dbRaw).forEach(id => {
                const u = dbRaw[id];
                const nume = (u.nume || "").toLowerCase();
                const cod = (id || "").toLowerCase();
                const sectie = (u.sectie || "").toLowerCase();
                const model = (u.model || "").toLowerCase();

                if (textCautat === "" || nume.includes(textCautat) || cod.includes(textCautat) || sectie.includes(textCautat) || model.includes(textCautat)) {
                    let col = "#2ecc71";
                    if (u.istoric) {
                        const istArr = Object.values(u.istoric);
                        const ultimaRev = istArr.find(i => i.revizie === true);
                        if (ultimaRev) {
                            const z = calculeazaZile(ultimaRev.data);
                            col = z < 30 ? "#2ecc71" : (z < 90 ? "#f39c12" : "#e74c3c");
                        }
                    }

                    const itemHtml = `
                    <div onclick="incarcaUtilaj('${id}'); map.setView([${u.lat}, ${u.lng}], 2);" style="padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 8px; cursor: pointer; border-left: 5px solid ${col}; transition: 0.2s; box-sizing: border-box;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong style="font-size: 13px; color: white;">${u.nume}</strong>
                            <span style="font-family: monospace; font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: #3498db; font-weight: bold;">${id}</span>
                        </div>
                        <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">📍 Secție: ${u.sectie} | Mod: ${u.model || '-'}</div>
                    </div>
                `;
                    corpLista.innerHTML += itemHtml;
                }
            });

            if (corpLista.innerHTML === "") {
                corpLista.innerHTML = "<p style='text-align:center; font-size:12px; color:var(--text-dim); padding:10px;'>Niciun utilaj găsit.</p>";
            }
            refreshPini();
        }

        async function salveaza() {
            const btn = document.getElementById('saveBtn');
            const msg = document.getElementById('feedbackMsg');
            const file = document.getElementById('fotoUtilaj').files[0];
            const esteOnline = navigator.onLine;

            btn.disabled = true;
            btn.innerText = (file && esteOnline) ? "⏳ SE ÎNCARCĂ POZA..." : "⏳ SE SALVEAZĂ...";

            try {
                const bifeValues = Array.from(document.querySelectorAll('.task:checked')).map(c => c.value);
                let verificariFinale = bifeValues.join(", ");
                const manual = document.getElementById('extraCheck') ? document.getElementById('extraCheck').value : "";
                if (manual !== "") verificariFinale = verificariFinale ? verificariFinale + " | " + manual : manual;

            // ⚙️ SOLUȚIA 6: GENERARE ID UNIC ABSOLUT (TIMESTAMP BAZĂ 36 + SECVENȚĂ RANDOM) - ZERO RISC COLIZIUNE
          /* const finalId = selectedId ? selectedId : "K-" + Date.now().toString(36).toUpperCase() + "-" + Math.floor(Math.random() * 10);
           */ let fortamOffline = false;

                // 🛡️ SISTEM ANTI-DUPLICARE ID: Generăm codul și verificăm dacă e liber
                let finalId = selectedId;
                if (!finalId) {
                    let idGenerat;
                    do {
                        const codScurt = Math.floor(1000 + Math.random() * 9000);
                        idGenerat = "K-" + codScurt;
                    } while (dbRaw[idGenerat] !== undefined); // Cât timp ID-ul există, mai trage un bilet!
                    finalId = idGenerat;
                }

                // 🧠 PRELUAREA INTELIGENTĂ A NUMELUI: Lista Fixă sau Scris de mână
                const numeSelectat = document.getElementById('mecanicSelect').value;
                const numeFinal = (numeSelectat === "Altcineva") ? document.getElementById('mecanicCustom').value : numeSelectat;

                const entry = {
                    data: document.getElementById('data').value,
                    tip: document.getElementById('tipInterventie').value,
                    mecanic: numeFinal || "Necunoscut", // Salvăm ce s-a ales sau s-a scris
                    verificari: verificariFinale,
                    obs: document.getElementById('obs').value,
                    timestamp: Date.now(),
                    revizie: document.getElementById('esteRevizie').checked,
                    foto: ""
                };

                if (esteOnline) {
                    const ruleazaFirebase = (promisiune) => Promise.race([
                        promisiune,
                        new Promise((_, r) => setTimeout(() => r(new Error("TIMEOUT")), 10000))
                    ]);

                    try {
                        if (file) {
                            const storageRef = firebase.storage().ref('utilaje/' + finalId + '/' + Date.now() + "_" + file.name);
                            const snap = await ruleazaFirebase(storageRef.put(file));
                            entry.foto = await snap.ref.getDownloadURL();
                        }

                        if (selectedId) {
                            await ruleazaFirebase(database.ref('utilaje/' + finalId + '/istoric').push(entry));
                            await ruleazaFirebase(database.ref('utilaje/' + finalId + '/model').set(document.getElementById('model').value));
                            await ruleazaFirebase(database.ref('utilaje/' + finalId + '/sectie').set(document.getElementById('sectie').value));
                            await ruleazaFirebase(database.ref('utilaje/' + finalId + '/nume').set(document.getElementById('nume').value));

                            const d = document.getElementById('data-punere').value;
                            if (d) await ruleazaFirebase(database.ref('utilaje/' + finalId + '/dataPunere').set(d));

                            if (entry.foto) {
                                await ruleazaFirebase(database.ref('utilaje/' + finalId + '/imagine').set(entry.foto));
                            }
                        } else {
                            await ruleazaFirebase(database.ref('utilaje/' + finalId).set({
                                id: finalId,
                                nume: document.getElementById('nume').value,
                                model: document.getElementById('model').value,
                                sectie: document.getElementById('sectie').value,
                                lat: currentCoords ? parseFloat(currentCoords[0]) : 0,
                                lng: currentCoords ? parseFloat(currentCoords[1]) : 0,
                                dataPunere: document.getElementById('data-punere').value,
                                imagine: entry.foto,
                                istoric: { "init": entry }
                            }));
                        }

                        msg.innerText = "✅ SALVAT CU SUCCES!";
                        msg.className = "msg-popup msg-success";

                    } catch (err) {
                        if (err.message === "TIMEOUT") fortamOffline = true;
                        else throw err;
                    }
                }

                if (!esteOnline || fortamOffline) {
                    let coada = JSON.parse(localStorage.getItem('coada_sincronizare')) || [];
                    coada.push({
                        isNew: !selectedId,
                        id: finalId,
                        nume: document.getElementById('nume').value,
                        model: document.getElementById('model').value,
                        sectie: document.getElementById('sectie').value,
                        lat: currentCoords ? parseFloat(currentCoords[0]) : null,
                        lng: currentCoords ? parseFloat(currentCoords[1]) : null,
                        entryData: entry
                    });
                    localStorage.setItem('coada_sincronizare', JSON.stringify(coada));

                    msg.innerText = "⚠️ SALVAT PE TELEFON (OFFLINE)!";
                    msg.className = "msg-popup msg-warning";
                    msg.style.borderColor = "#f39c12";
                    msg.style.color = "#f39c12";
                }

                msg.style.display = "block";

                setTimeout(() => {
                    if (typeof resetForm === "function") resetForm();
                    btn.innerText = "💾 SALVEAZĂ FIȘA";
                    btn.disabled = false;
                    msg.style.display = "none";
                }, 3000);

            } catch (e) {
                console.error(e);
                msg.innerText = "❌ EROARE: " + e.message;
                msg.className = "msg-popup msg-error";
                msg.style.display = "block";
                btn.disabled = false;
                btn.innerText = "💾 ÎNCEARCĂ DIN NOU";
            }
        }

        function resetForm() {
            selectedId = null;
            currentCoords = null;

            if (document.getElementById('searchBar')) { document.getElementById('searchBar').value = ""; }

            document.getElementById('form-container').style.display = 'none';
            document.getElementById('lista-utilaje-container').style.display = 'block';

            setTimeout(() => { map.invalidateSize(); }, 400);

            document.getElementById('nume').disabled = false;
            document.getElementById('model').disabled = false;
            document.getElementById('sectie').disabled = false;
            document.getElementById('data-punere').disabled = false;

            document.getElementById('nume').value = "";
            document.getElementById('model').value = "";
            document.getElementById('obs').value = "";
            // Resetăm lista fixă și căsuța ascunsă
            if (document.getElementById('mecanicSelect')) document.getElementById('mecanicSelect').value = "";
            if (document.getElementById('mecanicCustom')) {
                document.getElementById('mecanicCustom').value = "";
                document.getElementById('mecanicCustom').style.display = "none";
            }
            document.getElementById('data-punere').value = "";

            document.getElementById('status').innerHTML = "MOD: UTILAJ NOU";
            document.getElementById('status').className = "status-badge";
            document.getElementById('deleteZone').innerHTML = "";
            document.getElementById('fotoUtilaj').value = "";
            document.getElementById('esteRevizie').checked = false;

            if (document.getElementById('fileInput')) document.getElementById('fileInput').value = "";
            if (document.getElementById('containerPreview')) document.getElementById('containerPreview').style.display = "none";

            const btnSalvare = document.getElementById('saveBtn');
            btnSalvare.innerText = "💾 SALVEAZĂ FIȘA";
            btnSalvare.style.background = "var(--success)";
            document.getElementById('cancelBtn').style.display = "none";

            if (activeMarker) map.removeLayer(activeMarker);
            refreshPini();
            toggleExtra();
            checkReady();
            actualizeazaListaSidebar();
        }

        window.onload = () => {
            actualizeazaButonAdmin();
            setTimeout(() => { map.invalidateSize(); }, 500);
        };

        function verificareSalvare() {
            salveaza();
        }

        function updateConnectionStatus() {
            const cloudBanner = document.querySelector('.cloud-status');
            if (navigator.onLine) {
                cloudBanner.classList.remove('offline');
                cloudBanner.innerHTML = '<div class="dot"></div> CLOUD ONLINE';
                sincronizeazaDatele();
            } else {
                cloudBanner.classList.add('offline');
                cloudBanner.innerHTML = '⚠️ OFFLINE - SALVĂM LOCAL';
            }
        }

        async function sincronizeazaDatele() {
            let coada = JSON.parse(localStorage.getItem('coada_sincronizare')) || [];
            if (coada.length === 0) return;
            for (let item of coada) {
                try {
                    if (item.isNew) await database.ref('utilaje/' + item.id).set({ id: item.id, nume: item.nume, model: item.model, sectie: item.sectie, lat: item.lat, lng: item.lng, istoric: { "init": item.entryData } });
                    else {
                        await database.ref('utilaje/' + item.id + '/istoric').push(item.entryData);
                        await database.ref('utilaje/' + item.id + '/model').set(item.model);
                        await database.ref('utilaje/' + item.id + '/sectie').set(item.sectie);
                    }
                } catch (error) { return; }
            }
            localStorage.removeItem('coada_sincronizare'); alert("✅ Datele offline au fost sincronizate automat în Cloud!");
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        updateConnectionStatus();

        const dragHandle = document.getElementById('drag-handle');
        const sidebar = document.getElementById('sidebar');
        let touchStartY = 0;
        if (dragHandle && sidebar) {
            dragHandle.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
            dragHandle.addEventListener('touchend', (e) => {
                const dif = e.changedTouches[0].clientY - touchStartY;
                if (dif > 30) sidebar.classList.add('minimizat');
                else if (dif < -30) sidebar.classList.remove('minimizat');
                else sidebar.classList.toggle('minimizat');
            });
            dragHandle.addEventListener('click', () => sidebar.classList.toggle('minimizat'));
        }

        function toggleMinimize() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('minimizat');
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        function previewImagine(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('containerPreview').style.display = 'block';
                    document.getElementById('uploadStatus').innerText = "📍 Poză selectată (se va urca la Salvare)";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>

</html>
