    <script>
    // Verificăm dacă userul vine "la rece" (a scris link-ul manual)
    if (document.referrer === "") {
        // Îl trimitem direct la pagina principală
        window.location.href = "/"; 
    } else {
        // Verificăm dacă adresa de unde vine NU este site-ul tău
        // (asta previne blocarea dacă navighezi între paginile tale)
        var hostname = window.location.hostname;
        if (document.referrer.indexOf(hostname) === -1) {
            window.location.href = "/";
        }
    }
</script>

    <script>
        if (sessionStorage.getItem('access_granted') !== 'true') {
            window.location.href = 'index.html';
        }

        let timeout;
        
        function resetTimer() {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                sessionStorage.removeItem('access_granted');
                window.location.href = 'index.html';
            }, 1800000); // Auto-logout după 30 minute
        }

        window.onmousemove = resetTimer;
        window.onkeypress = resetTimer;

        window.onbeforeunload = function() {
            const numeField = document.getElementById('nume').value;
            if (numeField !== "") {
                return "Ai date nesalvate care se vor pierde!";
            }
        };
    </script>

    <style>
        /* Variabile de culoare */
        :root {
            --primary: #2c3e50;
            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --text: #ecf0f1;
            --text-dim: #bdc3c7;
        }

        /* Setări generale Body */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: #1a1a1a;
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
            /* Permite tabelelor să facă scroll orizontal pe ecrane mici fără să strice modalul */
.scroll-v {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
table {
    min-width: 500px; /* Forțează tabelul să păstreze proporțiile */
}
        /* Bara laterală stânga */
        #sidebar {
            width: 420px;
            height: 100vh;
            background: var(--primary);
            padding: 25px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        /* Logo */
        .logo-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-box img {
            max-width: 120px;
        }

        /* Butoane de navigare sus */
        .nav-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-nav {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
/* STATUS CLOUD (BULINA) */
        .cloud-status { 
            background: rgba(39, 174, 96, 0.1); 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            color: var(--success); 
            margin-bottom: 20px; 
            border: 1px solid var(--success); 
        }
        .dot { 
            width: 7px; 
            height: 7px; 
            background: var(--success); 
            border-radius: 50%; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 
            0% { opacity: 0.4; } 
            50% { opacity: 1; } 
            100% { opacity: 0.4; } 
        }
        /* Buton adăugare utilaj nou */
        .btn-add-new {
            background: var(--accent);
            color: #000;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 13px;
        }

        /* Etichetă Status Curent */
        .status-badge {
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border-left: 5px solid var(--accent);
            background: rgba(0,0,0,0.2);
        }

        .status-edit {
            border-left-color: #3498db;
            color: #3498db;
        }

        /* Grupuri de input-uri */
        .group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        /* Zona de bife (Checklist) */
        .checklist {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px dashed rgba(255,255,255,0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .check-item input {
            width: auto;
            margin: 0;
        }

        /* Butoane de acțiune */
        .btn-save {
            background: var(--success);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-save:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .btn-del {
            background: none;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            margin-top: 15px;
        }

        /* Feedback Popup */
        .msg-popup {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .msg-success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #27ae60;
        }

        .msg-error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #c0392b;
        }

        /* Harta Leaflet */
        #map {
            flex: 1;
            background: #222;
            cursor: crosshair;
        }

        .existing-pin {
            filter: hue-rotate(150deg) brightness(1.2);
        }
    </style>
</head>

<div id="map"></div>

<script>
    // 1. Configurare Firebase
    const firebaseConfig = { 
        databaseURL: "https://killer-mentenanta-default-rtdb.europe-west1.firebasedatabase.app/" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    // DETECTOR DE SEMNAL (ONLINE / OFFLINE)
    let esteOnline = true;
    firebase.database().ref('.info/connected').on('value', function(snap) {
        esteOnline = snap.val() === true;
        
        const cloudBtn = document.querySelector('.cloud-status');
        if(cloudBtn) {
            if (esteOnline) {
                cloudBtn.innerHTML = '<div class="dot" style="background:#2ecc71;"></div> CLOUD ONLINE & ACTIV';
                cloudBtn.style.color = '#2ecc71';
                cloudBtn.style.borderColor = '#2ecc71';
            } else {
                cloudBtn.innerHTML = '<div class="dot" style="background:#e74c3c;"></div> FĂRĂ SEMNAL (SALVARE LOCALĂ)';
                cloudBtn.style.color = '#e74c3c';
                cloudBtn.style.borderColor = '#e74c3c';
            }
        }
    });

    // 2. Configurare Hartă Leaflet
    var map = L.map('map', { 
        crs: L.CRS.Simple, 
        minZoom: 0, 
        maxZoom: 3 
    });
    
    L.imageOverlay('harta.jpg', [[0, 0], [1000, 1400]]).addTo(map);
    map.setView([500, 700], 1); 

    // 3. Variabile Globale
    let dbRaw = {};
    let markersGroup = L.layerGroup().addTo(map);
    let activeMarker = null;
    let selectedId = null;
    let currentCoords = null;
    
    // Setăm data de astăzi automat în câmpul Dată
    document.getElementById('data').valueAsDate = new Date();

    // 4. Ascultăm baza de date pentru actualizări în timp real
   database.ref('utilaje').on('value', (snap) => { 
        dbRaw = snap.val() || {}; 
        refreshPini(); 

        // AUTOLOAD DIN QR CODE (CITIRE SCANARE)
        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id');
        
        // Dacă am venit din Scanare și utilajul există, îl încărcăm automat pe ecran!
        if (qrId && dbRaw[qrId] && selectedId !== qrId) {
            incarcaUtilaj(qrId);
        }
    });

    // 5. Funcția pentru afișarea pinilor pe hartă (în modul edit)
    function refreshPini() {
        markersGroup.clearLayers();
        
        Object.keys(dbRaw).forEach(id => {
            const u = dbRaw[id];
            
            if (u.lat && u.lng) {
                const customIcon = L.icon({ 
                    iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png', 
                    className: 'existing-pin', 
                    iconSize: [25, 41], 
                    iconAnchor: [12, 41] 
                });
                
                const m = L.marker([u.lat, u.lng], { icon: customIcon }).addTo(markersGroup);
                
                m.on('click', (e) => { 
                    L.DomEvent.stopPropagation(e); 
                    incarcaUtilaj(id); 
                });
            }
        });
    }

    // 6. Funcția de click pe hartă pentru a adăuga un pin nou
    map.on('click', (e) => {
        // Dacă edităm deja un utilaj existent, nu putem adăuga unul nou din greșeală
        if (selectedId) {
            return; 
        }
        
        currentCoords = [e.latlng.lat.toFixed(0), e.latlng.lng.toFixed(0)];
        
        // Ștergem pinul provizoriu dacă exista deja unul pus
        if (activeMarker) {
            map.removeLayer(activeMarker);
        }
        
        activeMarker = L.marker(e.latlng).addTo(map); 
        
        checkReady();
    });

    // 7. Funcția de încărcare a datelor când dăm click pe un utilaj existent
    function incarcaUtilaj(id) {
        selectedId = id; 
        const u = dbRaw[id];
        
        document.getElementById('nume').value = u.nume; 
        document.getElementById('model').value = u.model || ""; 
        document.getElementById('sectie').value = u.sectie;
        
        document.getElementById('status').innerHTML = `MOD: EDITARE UTILAJ (ID: ${id})`; 
        document.getElementById('status').className = "status-badge status-edit";
        
        // Creăm butonul de ștergere definitivă
        const deleteBtnHtml = `<button class="btn-del" onclick="stergeUtilaj('${id}')">⚠️ ȘTERGE UTILAJ DEFINITIV</button>`;
        document.getElementById('deleteZone').innerHTML = deleteBtnHtml;
        
        if (activeMarker) {
            map.removeLayer(activeMarker);
        }
        
        toggleExtra(); 
        checkReady();
    }

    // 8. BIFE DINAMICE CONFORM PLANULUI 2026
    function toggleExtra() {
        const s = document.getElementById('sectie').value;
        const extraFieldsDiv = document.getElementById('extraFields');
        
        let html = '<label>Operațiuni Plan Mentenanță 2026:</label><div class="checklist">';

        // 1. TOCARE ȘI INJECTARE (Cuter, Injectoare, Malaxoare)
        if (s === 'Tocare' || s === 'Injectare' || s === 'Fabricație') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Hidraulic"> Schimb Ulei Hidraulic</label>
                <label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Vacuum"> Schimb Ulei Pompă Vacuum</label>
                <label class="check-item"><input type="checkbox" class="task" value="Filtre Aer/Ulei"> Verificare/Schimb Filtre</label>
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Lagare/Rulmenti"> Gresare Lagăre/Rulmenți</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Cutite/Ace"> Verificare Cuțite/Ace</label>
                <label class="check-item"><input type="checkbox" class="task" value="Motor principal"> Motor principal & Curele</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Generală"> Verificare Generală</label>
            `;
        } 
        // 2. TRATAMENT TERMIC (Celule Afumare)
        else if (s === 'Tratament Termic') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Tubulatura"> Curățare Tubulatură</label>
                <label class="check-item"><input type="checkbox" class="task" value="Clapeti"> Clapete </label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Ventilatoare"> Motoare Ventilație</label>
                <label class="check-item"><input type="checkbox" class="task" value="Sonda Temp"> Calibrare Sondă</label>
                <label class="check-item"><input type="checkbox" class="task" value="Sonda Temperatură"> Înlocuire Sonde Temperatură </label>
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Balamale/Garnituri"> Gresare Balamale & Garnituri</label>
                <label class="check-item"><input type="checkbox" class="task" value="Generator Fum"> Mentenanță Generator Fum</label>
                <label class="check-item"><input type="checkbox" class="task" value="Altele"> Altele - Specifica mai jos </label>
            `;
        }
        // 3. AMBALARE VID
        else if (s === 'Ambalare Vid') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Ulei Pompa Vid"> Schimb Ulei Pompă Vid</label>
                <label class="check-item"><input type="checkbox" class="task" value="Filtre Separatoare"> Filtre Separatoare Ulei</label>
                <label class="check-item"><input type="checkbox" class="task" value="Rezistente/Teflon"> Rezistențe Lipire & Teflon</label>
                <label class="check-item"><input type="checkbox" class="task" value="Membrane/Garnituri"> Verificare Membrane/Garnituri</label>
            `;
        }
        // 4. DEPOZITARE (Frig / Compresoare)
        else if (s === 'Depozitare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Nivel Freon"> Verificare Nivel Freon</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Condensatoare"> Curățare Condensatoare</label>
                <label class="check-item"><input type="checkbox" class="task" value="Motoare Ventilatoare"> Ventilatoare Vaporizator</label>
                <label class="check-item"><input type="checkbox" class="task" value="Garnituri Usi"> Verificare Etanșeitate Uși</label>
            `;
        }
        else if (s === 'Spălare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Pompa"> Schimb Ulei Pompă</label>
                <label class="check-item"><input type="checkbox" class="task" value="Etansare Pompa/Presetupe"> Etanșare Pompă (Presetupe/Garnituri)</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Furtunuri/Cuplaje"> Verificare Furtunuri & Cuplaje</label>
                <label class="check-item"><input type="checkbox" class="task" value="Motor si Curele"> Motor Electric & Curele Transmisie</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Duze/Accesorii"> Curățare Duze & Accesorii</label>
                <label class="check-item"><input type="checkbox" class="task" value="Filtre Apa"> Verificare Filtre/Decantoare Apă</label>
            `;
        }
        // 5. TRANȘARE (Feliatoare / Benzi)
        else if (s === 'Tranșare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Ghidaje"> Gresare Ghidaje/Liniar</label>
                <label class="check-item"><input type="checkbox" class="task" value="Ascutire Lama"> Ascuțire/Verificare Lamă</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Benzi"> Verificare Stare Benzi</label>
                <label class="check-item"><input type="checkbox" class="task" value="Senzori Prezenta"> Curățare/Reglare Fotocelule</label>
            `;
        }
        // 6. DEFAULT (Restul secțiilor)
        else {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Inspectie Vizuala"> Inspecție Vizuală Generală</label>
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Generala"> Gresare Componente Mobile</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Suruburi"> Strângere Șuruburi/Fixări</label>
                <label class="check-item"><input type="checkbox" class="task" value="Tablou Electric"> Suflare/Strângere Tablou El.</label>
            `;
        }
        
        html += `</div>`;
        html += `<div class="group" style="margin-top:10px;">`;
        html += `<label>Altă operațiune manuală (Piese înlocuite):</label>`;
        html += `<input type="text" id="extraCheck" placeholder="Ex: Înlocuit rulment 6205...">`;
        html += `</div>`;
        
        extraFieldsDiv.innerHTML = html;
    }
    // 9. Verificare validitate formular înainte de salvare
    function checkReady() {
        const numeValid = document.getElementById('nume').value.trim().length > 2;
        const areLocatie = (selectedId !== null) || (currentCoords !== null);
        
        const saveBtn = document.getElementById('saveBtn');
        
        if (areLocatie && numeValid) {
            saveBtn.disabled = false;
        } else {
            saveBtn.disabled = true;
        }
    }

    // 10. Ștergerea unui utilaj
    async function stergeUtilaj(id) { 
        const confirmare = confirm("Ești sigur că vrei să ștergi acest utilaj și întregul său istoric?");
        if (confirmare) { 
            await database.ref('utilaje/' + id).remove(); 
            resetForm(); 
        } 
    }

    // 11. Funcția principală de salvare a datelor
    async function salveaza() {
        const btn = document.getElementById('saveBtn'); 
        const msg = document.getElementById('feedbackMsg');
        const fileInput = document.getElementById('fotoUtilaj');
        const file = fileInput.files[0];
        
        btn.disabled = true; 
        btn.innerText = file ? "⏳ SE ÎNCARCĂ POZA ȘI DATELE..." : "⏳ SE SALVEAZĂ...";

        try {
            const bifeList = document.querySelectorAll('.task:checked');
            const bifeArray = Array.from(bifeList);
            const bifeValues = bifeArray.map(c => c.value);
            const bifeString = bifeValues.join(", ");
            
            const extraCheckElement = document.getElementById('extraCheck');
            let manual = "";
            if (extraCheckElement) {
                manual = extraCheckElement.value;
            }
            
            let verificariFinale = bifeString;
            if (manual !== "") {
                if (verificariFinale !== "") {
                    verificariFinale += " | " + manual;
                } else {
                    verificariFinale = manual;
                }
            }
            
            let costValoare = parseFloat(document.getElementById('cost').value);
            if (isNaN(costValoare)) costValoare = 0;

            const isRevizie = document.getElementById('esteRevizie').checked;

            // ---- LOGICA DE ÎNCĂRCARE FOTO ----
            let fotoUrl = "";
            if (file) {
                const storageRef = firebase.storage().ref('mentenanta/' + Date.now() + "_" + file.name);
                const snapshot = await storageRef.put(file);
                fotoUrl = await snapshot.ref.getDownloadURL();
            }
            // ----------------------------------

            const entry = {
                data: document.getElementById('data').value,
                tip: document.getElementById('tipInterventie').value,
                mecanic: document.getElementById('mecanic').value,
                cost: costValoare,
                verificari: verificariFinale,
                obs: document.getElementById('obs').value,
                timestamp: Date.now(), 
                revizie: isRevizie,
                foto: fotoUrl // Salvăm link-ul pozei în baza de date
            };

            // LOGICA DE SALVARE (CU SUPORT OFFLINE)
            if (selectedId) {
                const istoricRef = database.ref('utilaje/' + selectedId + '/istoric').push();
                
                // Setăm datele (fără "await" dacă suntem offline, pentru a nu bloca aplicația)
                istoricRef.set(entry);
                database.ref('utilaje/' + selectedId + '/model').set(document.getElementById('model').value);
                database.ref('utilaje/' + selectedId + '/sectie').set(document.getElementById('sectie').value);
            } else {
                const idGenerat = Math.floor(1000 + Math.random() * 9000);
                const idNou = "K-" + idGenerat;
                const utilajNouObject = { 
                    id: idNou, nume: document.getElementById('nume').value, 
                    model: document.getElementById('model').value, sectie: document.getElementById('sectie').value, 
                    lat: parseFloat(currentCoords[0]), lng: parseFloat(currentCoords[1]), 
                    istoric: { "init": entry } 
                };
                
                database.ref('utilaje/' + idNou).set(utilajNouObject);
            }

            // MESAJE DE SUCCES ÎN FUNCȚIE DE SEMNAL
            if (esteOnline) {
                msg.innerText = "✅ SALVAT CU SUCCES ÎN CLOUD!"; 
                msg.className = "msg-popup msg-success"; 
            } else {
                msg.innerText = "⚠️ SALVAT PE TELEFON! (Datele se vor sincroniza când revine semnalul)"; 
                msg.className = "msg-popup msg-error"; // Folosim culoarea roșie/portocalie ca să îi atragă atenția
                msg.style.borderColor = "#f39c12";
                msg.style.color = "#f39c12";
            }
            
            msg.style.display = "block";
            
            setTimeout(() => { 
                resetForm(); 
                btn.innerText = "💾 SALVEAZĂ FIȘA"; 
                msg.style.display = "none"; 
            }, 3000); // Ținem mesajul un pic mai mult pe ecran (3 secunde)

            msg.innerText = "✅ SALVAT CU SUCCES!"; 
            msg.className = "msg-popup msg-success"; 
            msg.style.display = "block";
            
            setTimeout(() => { 
                resetForm(); 
                btn.innerText = "💾 SALVEAZĂ FIȘA"; 
                msg.style.display = "none"; 
            }, 2000);
            
        } catch(e) {
            msg.innerText = "❌ EROARE: " + e.message; 
            msg.className = "msg-popup msg-error"; 
            msg.style.display = "block";
            btn.disabled = false; 
            btn.innerText = "💾 ÎNCEARCĂ DIN NOU";
        }
    }

    // 12. Resetare formular pentru acțiuni noi
    function resetForm() {
        selectedId = null; 
        currentCoords = null;
        
        document.getElementById('nume').value = ""; 
        document.getElementById('model').value = ""; 
        document.getElementById('obs').value = ""; 
        document.getElementById('mecanic').value = "";
        document.getElementById('cost').value = "";
        
        document.getElementById('status').innerHTML = "MOD: UTILAJ NOU"; 
        document.getElementById('status').className = "status-badge"; 
        document.getElementById('deleteZone').innerHTML = "";
        document.getElementById('fotoUtilaj').value = "";
        
        if (activeMarker) {
            map.removeLayer(activeMarker); 
        }
        
        toggleExtra(); 
        checkReady();
    }

    // Inițializare scripturi după ce se încarcă pagina
    toggleExtra(); 
    
    window.onload = () => { 
        setTimeout(() => {
            map.invalidateSize();
        }, 500); 
    };
</script>
