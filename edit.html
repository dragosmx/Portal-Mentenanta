<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrare - Killer SRL</title>
    <meta name="mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mentenanță">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    
 <style>
        :root {
            --primary: #2c3e50;
            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --text: #ecf0f1;
            --text-dim: #bdc3c7;
        }

        /* --- STILURI DE BAZĂ (PC) --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row; /* Pe PC stau stânga-dreapta */
            height: 100vh;
            background: #1a1a1a;
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #sidebar {
            width: 420px;
            min-width: 420px;
            height: 100vh;
            background: var(--primary);
            padding: 25px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        #map {
            flex: 1;
            height: 100vh;
            background: #222;
        }
        
        /* Pentru a asigura cruciulița pe hartă pe desktop */
        .leaflet-container {
            cursor: crosshair !important;
        }

        /* --- STILURI PENTRU MOBIL (Sub 768px) --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* Forțăm elementele sus-jos */
                overflow-y: auto; /* Permitem scroll pe toată pagina */
                height: auto;
            }
            #sidebar {
                width: 100%;
                min-width: 100%;
                height: auto;
                overflow: visible;
                order: 2; /* Sidebar-ul merge JOS */
            }
            #map {
                width: 100%;
                height: 55vh; /* Harta ocupă puțin peste jumătate din ecran */
                order: 1; /* Harta merge SUS */
                flex: none;
            }
        }

        .scroll-v { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { min-width: 500px; }

        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { max-width: 120px; }

        .nav-header { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-nav { padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; text-align: center; text-decoration: none; font-size: 11px; font-weight: bold; cursor: pointer; }
        
        .cloud-status { background: rgba(39, 174, 96, 0.1); padding: 10px; border-radius: 8px; font-size: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--success); margin-bottom: 20px; border: 1px solid var(--success); }
        .cloud-status.offline { background: rgba(231, 76, 60, 0.1); border-color: var(--danger); color: var(--danger); }
        .dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        .cloud-status.offline .dot { background: var(--danger); animation: none; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        .btn-add-new { background: var(--accent); color: #000; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 15px; font-size: 13px; }

        /* --- ASCUNDEREA FORMULARULUI --- */
        #form-container {
            display: none;
            background: transparent;
        }

        .status-badge { padding: 12px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-bottom: 15px; text-align: center; border-left: 5px solid var(--accent); background: rgba(0,0,0,0.2); }
        .status-edit { border-left-color: #3498db; color: #3498db; }

        .group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }

        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; font-size: 13px; box-sizing: border-box; outline: none; font-family: inherit; }
        textarea { resize: vertical; } /* Permite redimensionarea doar pe inaltime */
        select option { background: #2c3e50; color: white; }

        .checklist { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-top: 5px; border: 1px dashed rgba(255,255,255,0.1); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 11px; cursor: pointer; }
        .check-item input { width: auto; margin: 0; }

        .btn-save { background: var(--success); color: white; padding: 18px; border: none; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        .btn-save:disabled { opacity: 0.2; cursor: not-allowed; }
        .btn-del { background: none; color: var(--danger); border: 1px solid var(--danger); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-size: 11px; margin-top: 15px; }

        .msg-popup { padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 12px; font-weight: bold; text-align: center; display: none; }
        .msg-success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #27ae60; }
        .msg-error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #c0392b; }

        .custom-pin svg { filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3)); shape-rendering: geometricPrecision; }
        .pin-selectat svg { filter: drop-shadow(0 0 10px #3498db) drop-shadow(0 0 15px #3498db) !important; transform: scale(1.2); transition: all 0.3s ease; }
        .pin-selectat path { stroke: #3498db !important; stroke-width: 2.5px !important; }
    </style>
</head>

<body>

<div id="sidebar">
    <div class="logo-box">
        <img src="logo.png" alt="Logo">
    </div>
    
    <div class="nav-header">
        <a href="index.html" class="btn-nav">🏠 PORTAL</a>
        <a href="view.html" class="btn-nav">👁️ VIZUALIZARE</a>
    </div>
    <div class="cloud-status">
        <div class="dot"></div> CLOUD ONLINE & ACTIV
    </div>
    
    <button class="btn-add-new" onclick="executCuProtectie(Form)">➕ ADĂUGARE UTILAJ NOU</button>
    
    <div id="form-container" style="display: none;">
        <div id="status" class="status-badge">MOD: UTILAJ NOU</div>

        <div class="group" id="grup-punere-functiune">
            <label>Data Punere în Funcțiune (Fixă)</label>
            <input type="date" id="data-punere">
        </div>

        <div class="group">
            <label>Denumire Utilaj</label>
            <input type="text" id="nume" placeholder="Ex: Cuter Seydelmann 330L" oninput="checkReady()">
        </div>
        
        <div class="group">
            <label>Model / Serie</label>
            <input type="text" id="model" placeholder="Ex: SN 16400-1">
        </div>
        
        <div class="group">
            <label>Secție</label>
            <select id="sectie" onchange="toggleExtra()">
                <option value="Tranșare">Tranșare </option>
                <option value="Injectare">Injectare</option>
                <option value="Tocare">Tocare </option>
                <option value="Fabricație">Fabricație</option>
                <option value="Tratament Termic">Tratament Termic (Celule)</option>
                <option value="Secție Crude">Secție Crude</option>
                <option value="Ambalare Vid">Ambalare Vid</option>
                <option value="Livrare">Livrare (Cântare)</option>
                <option value="Depozitare">Depozitare (Frig)</option>
            </select>
        </div>

        <div class="group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label>Data</label>
                <input type="date" id="data">
            </div>
            <div>
                <label>Tip Intervenție</label>
                <select id="tipInterventie">
                    <option value="Mentenanță Preventivă">Preventivă (Plan)</option>
                    <option value="Mentenanță Corectivă">Corectivă (Defect)</option>
                    <option value="Inspecție Vizuală">Inspecție Săptămânală</option>
                </select>
            </div>
        </div>
        
        <div class="group" style="background: rgba(46, 204, 113, 0.1); border: 1px solid rgba(46, 204, 113, 0.3); padding: 12px; border-radius: 8px;">
            <label class="check-item" style="color: #2ecc71; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="esteRevizie" style="width: 18px; height: 18px; cursor: pointer;">
                BIFEAZĂ DACĂ ACEASTA ESTE O REVIZIE SAU MENTENANȚĂ PREVENTIVĂ
            </label>
        </div>

        <div class="group" style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
            <div>
                <label>Efectuat de (Mecanic):</label>
                <input type="text" id="mecanic" placeholder="Nume mecanic...">
            </div>
        </div>

        <div id="extraFields"></div>

        <div class="group">
            <label>Observații / Piese înlocuite</label>
            <textarea id="obs" rows="3" placeholder="Ex: Înlocuit ulei Shell Tellus 90..."></textarea>
        </div>
        
        <div class="group">
            <label>📸 FOTOGRAFIE DEFECT / REPARAȚIE (OPȚIONAL)</label>
            <input type="file" id="fotoUtilaj" accept="image/*" capture="environment" style="padding: 10px;">
            <p style="font-size: 9px; color: #888;">* Poza se va încărca automat la salvare.</p>
        </div>
        
        <button class="btn-save" id="saveBtn" onclick="verificareSalvare()" disabled>💾 SALVEAZĂ FIȘA</button>
        
        <div id="feedbackMsg" class="msg-popup"></div>
        
        <div id="deleteZone"></div>
    </div> </div>

<div id="map"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBHfyZzJ-GUfUUqEidMytaCSh-B2SYh1Ks",
        authDomain: "killer-mentenanta.firebaseapp.com",
        databaseURL: "https://killer-mentenanta-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "killer-mentenanta",
        storageBucket: "killer-mentenanta.firebasestorage.app",
        messagingSenderId: "434460062600",
        appId: "1:434460062600:web:38a2ff00266c3c1dff403d"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    firebase.auth().onAuthStateChanged((user) => {
        if (!user) { 
            window.location.href = "index.html"; 
        }
    });

    var map = L.map('map', { 
        crs: L.CRS.Simple, 
        minZoom: 0, 
        maxZoom: 3 
    });
    
    L.imageOverlay('harta.jpg', [[0, 0], [1000, 1400]]).addTo(map);
    map.setView([500, 700], 1); 

    let dbRaw = {};
    let markersGroup = L.layerGroup().addTo(map);
    let activeMarker = null;
    let selectedId = null;
    let currentCoords = null;
    
    function calculeazaZile(dataString) {
        if (!dataString || dataString === "-") return 999; 
        let dt = new Date(dataString);
        if (isNaN(dt)) {
            const p = dataString.split(/[./-]/);
            if (p.length === 3) dt = new Date(p[2], p[1]-1, p[0]);
        }
        const azi = new Date();
        azi.setHours(0,0,0,0);
        const diff = Math.floor((azi - dt) / 86400000);
        return diff < 0 ? 0 : diff;
    }
    
    document.getElementById('data').valueAsDate = new Date();

    database.ref('utilaje').on('value', (snap) => { 
        dbRaw = snap.val() || {}; 
        refreshPini(); 

        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id');
        
        if (qrId && dbRaw[qrId] && selectedId !== qrId) {
            incarcaUtilaj(qrId);
        }
    });

    function refreshPini() {
        markersGroup.clearLayers();
        Object.keys(dbRaw).forEach(id => {
            const u = dbRaw[id];
            if (u.lat && u.lng) {
                let col = "#2ecc71"; 
                if (u.istoric) {
                    const istArr = Object.values(u.istoric);
                    const ultimaRev = istArr.find(i => i.revizie === true);
                    if (ultimaRev) {
                        const z = calculeazaZile(ultimaRev.data); 
                        col = z < 30 ? "#2ecc71" : (z < 90 ? "#f39c12" : "#e74c3c");
                    }
                }

                const esteSelectat = (id === selectedId);
                const clasaPin = esteSelectat ? 'custom-pin pin-selectat' : 'custom-pin';

                const customIcon = L.divIcon({ 
                    className: clasaPin, 
                    html: `
                        <svg width="30" height="45" viewBox="0 0 30 45" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="15" cy="42" rx="7" ry="2" fill="rgba(0,0,0,0.15)" />
                            <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 30 15 30s15-19.5 15-30c0-8.3-6.7-15-15-15z" fill="${col}" stroke="#fff" stroke-width="0.5"/>
                            <circle cx="15" cy="15" r="5.5" fill="white"/>
                        </svg>
                    `,
                    iconSize: [30, 45], 
                    iconAnchor: [15, 45],
                    popupAnchor: [0, -45]
                });
                
                const m = L.marker([u.lat, u.lng], { 
                    icon: customIcon,
                    zIndexOffset: esteSelectat ? 1000 : 0 
                }).addTo(markersGroup);
                
                m.on('click', (e) => { 
                    L.DomEvent.stopPropagation(e); 
                    incarcaUtilaj(id); 
                });
            }
        });
    }
   
    map.on('click', (e) => {
        // Dacă avem un utilaj selectat și dăm click pe hartă, închidem totul (ne-am răzgândit)
        /*if (selectedId) {
            resetForm();
            return;
        }*/
        resetForm();
        // Dacă nu avem nimic selectat, procedăm la adăugarea unui utilaj nou
        currentCoords = [e.latlng.lat.toFixed(0), e.latlng.lng.toFixed(0)];
        
        if (activeMarker) map.removeLayer(activeMarker);
        activeMarker = L.marker(e.latlng).addTo(map); 
        
        // Afișăm formularul
        document.getElementById('form-container').style.display = 'block';
        document.getElementById('data-punere').disabled = false;
        
        // Scroll pe mobil direct la formular
        if(window.innerWidth <= 768) {
            document.getElementById('sidebar').scrollIntoView({ behavior: 'smooth' });
        }
        
        checkReady();
    });

    function incarcaUtilaj(id) {
        selectedId = id; 
        const u = dbRaw[id];
        
        // Afișăm formularul
        document.getElementById('form-container').style.display = 'block';
        
        const campPunere = document.getElementById('data-punere');
        if (u.dataPunere) {
            campPunere.value = u.dataPunere;
            campPunere.disabled = true;
        } else {
            campPunere.value = "";
            campPunere.disabled = false;
        }

        document.getElementById('nume').value = u.nume; 
        document.getElementById('model').value = u.model || ""; 
        document.getElementById('sectie').value = u.sectie;
        document.getElementById('status').innerHTML = `MOD: EDITARE UTILAJ (ID: ${id})`; 
        document.getElementById('status').className = "status-badge status-edit";
        
        const deleteBtnHtml = `<button class="btn-del" onclick="executCuProtectie(() => stergeUtilaj('${id}'))">⚠️ ȘTERGE UTILAJ DEFINITIV</button>`;
        document.getElementById('deleteZone').innerHTML = deleteBtnHtml;
        
        if (activeMarker) map.removeLayer(activeMarker);
        
        toggleExtra(); 
        checkReady();
        refreshPini();

        // Scroll pe mobil direct la formular
        if(window.innerWidth <= 768) {
            document.getElementById('sidebar').scrollIntoView({ behavior: 'smooth' });
        }
        document.getElementById('form-container').style.display = 'none';
    }

    function toggleExtra() {
        const s = document.getElementById('sectie').value;
        const extraFieldsDiv = document.getElementById('extraFields');
        
        let html = '<label>Operațiuni Plan Mentenanță 2026:</label><div class="checklist">';

        if (s === 'Tocare' || s === 'Injectare' || s === 'Fabricație') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Hidraulic"> Schimb Ulei Hidraulic</label>
                <label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Vacuum"> Schimb Ulei Pompă Vacuum</label>
                <label class="check-item"><input type="checkbox" class="task" value="Filtre Aer/Ulei"> Verificare/Schimb Filtre</label>
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Lagare/Rulmenti"> Gresare Lagăre/Rulmenți</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Cutite/Ace"> Verificare Cuțite/Ace</label>
                <label class="check-item"><input type="checkbox" class="task" value="Motor principal"> Motor principal & Curele</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Generală"> Verificare Generală</label>
                <label class="check-item"><input type="checkbox" class="task" value="Înlocuire Cuțite/Site"> Înlocuire Cuțite/Site</label>
            `;
        } else if (s === 'Tratament Termic') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Tubulatura"> Curățare Tubulatură</label>
                <label class="check-item"><input type="checkbox" class="task" value="Clapeti"> Clapete </label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Ventilatoare"> Motoare Ventilație</label>
                <label class="check-item"><input type="checkbox" class="task" value="Sonda Temp"> Calibrare Sondă</label>
                <label class="check-item"><input type="checkbox" class="task" value="Sonda Temperatură"> Înlocuire Sonde Temperatură </label>
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Balamale/Garnituri"> Gresare Balamale & Garnituri</label>
                <label class="check-item"><input type="checkbox" class="task" value="Generator Fum"> Mentenanță Generator Fum</label>
                <label class="check-item"><input type="checkbox" class="task" value="Altele"> Altele - Specifica mai jos </label>
            `;
        } else if (s === 'Ambalare Vid') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Ulei Pompa Vid"> Schimb Ulei Pompă Vid</label>
                <label class="check-item"><input type="checkbox" class="task" value="Filtre Separatoare"> Filtre Separatoare Ulei</label>
                <label class="check-item"><input type="checkbox" class="task" value="Rezistente/Teflon"> Rezistențe Lipire & Teflon</label>
                <label class="check-item"><input type="checkbox" class="task" value="Membrane/Garnituri"> Verificare Membrane/Garnituri</label>
            `;
        } else if (s === 'Depozitare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Nivel Freon"> Verificare Nivel Freon</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Condensatoare"> Curățare Condensatoare</label>
                <label class="check-item"><input type="checkbox" class="task" value="Motoare Ventilatoare"> Ventilatoare Vaporizator</label>
                <label class="check-item"><input type="checkbox" class="task" value="Garnituri Usi"> Verificare Etanșeitate Uși</label>
            `;
        } else if (s === 'Spălare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Schimb Ulei Pompa"> Schimb Ulei Pompă</label>
                <label class="check-item"><input type="checkbox" class="task" value="Etansare Pompa/Presetupe"> Etanșare Pompă (Presetupe/Garnituri)</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Furtunuri/Cuplaje"> Verificare Furtunuri & Cuplaje</label>
                <label class="check-item"><input type="checkbox" class="task" value="Motor si Curele"> Motor Electric & Curele Transmisie</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Duze/Accesorii"> Curățare Duze & Accesorii</label>
                <label class="check-item"><input type="checkbox" class="task" value="Filtre Apa"> Verificare Filtre/Decantoare Apă</label>
            `;
        } else if (s === 'Tranșare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Ghidaje"> Gresare Ghidaje/Liniar</label>
                <label class="check-item"><input type="checkbox" class="task" value="Ascutire Lama"> Ascuțire/Verificare Lamă</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curatare Benzi"> Verificare Stare Benzi</label>
                <label class="check-item"><input type="checkbox" class="task" value="Senzori Prezenta"> Curățare/Reglare Fotocelule</label>
            `;
        } else {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Inspectie Vizuala"> Inspecție Vizuală Generală</label>
                <label class="check-item"><input type="checkbox" class="task" value="Gresare Generala"> Gresare Componente Mobile</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Suruburi"> Strângere Șuruburi/Fixări</label>
                <label class="check-item"><input type="checkbox" class="task" value="Tablou Electric"> Suflare/Strângere Tablou El.</label>
            `;
        }
        
        html += `</div>`;
        html += `<div class="group" style="margin-top:10px;">`;
        html += `<label>Altă operațiune manuală (Piese înlocuite):</label>`;
        html += `<textarea id="extraCheck" rows="3" placeholder="Ex: Înlocuit rulment 6205..."></textarea>`;
        html += `</div>`;
        
        extraFieldsDiv.innerHTML = html;
    }

    function checkReady() {
        const numeValid = document.getElementById('nume').value.trim().length > 2;
        const areLocatie = (selectedId !== null) || (currentCoords !== null);
        
        const saveBtn = document.getElementById('saveBtn');
        
        if (areLocatie && numeValid) {
            saveBtn.disabled = false;
        } else {
            saveBtn.disabled = true;
        }
    }

    async function stergeUtilaj(id) { 
        const confirmare = confirm("Ești sigur că vrei să ștergi acest utilaj și întregul său istoric?");
        if (confirmare) { 
            await database.ref('utilaje/' + id).remove(); 
            resetForm(); 
        } 
    }

    async function salveaza() {
        const btn = document.getElementById('saveBtn');
        const msg = document.getElementById('feedbackMsg');
        const fileInput = document.getElementById('fotoUtilaj');
        const file = fileInput.files[0];
        const esteOnline = navigator.onLine;

        btn.disabled = true;
        btn.innerText = (file && esteOnline) ? "⏳ SE ÎNCARCĂ POZA..." : "⏳ SE SALVEAZĂ...";

        try {
            const bifeList = document.querySelectorAll('.task:checked');
            const bifeValues = Array.from(bifeList).map(c => c.value);
            let verificariFinale = bifeValues.join(", ");

            const extraCheckElement = document.getElementById('extraCheck');
            let manual = extraCheckElement ? extraCheckElement.value : "";
            if (manual !== "") {
                verificariFinale = verificariFinale !== "" ? verificariFinale + " | " + manual : manual;
            }

            const isRevizie = document.getElementById('esteRevizie').checked;
            const finalId = selectedId ? selectedId : "K-" + Math.floor(1000 + Math.random() * 9000);

            let fortamOffline = false; 

            const entry = {
                data: document.getElementById('data').value, tip: document.getElementById('tipInterventie').value,
                mecanic: document.getElementById('mecanic').value, verificari: verificariFinale,
                obs: document.getElementById('obs').value, timestamp: Date.now(),
                revizie: isRevizie, foto: "" 
            };

            if (esteOnline) {
                const ruleazaFirebase = (promisiune) => Promise.race([
                    promisiune,
                    new Promise((_, reject) => setTimeout(() => reject(new Error("TIMEOUT_FIREBASE")), 8000))
                ]);

                try {
                    if (file) {
                        const storageRef = firebase.storage().ref('mentenanta/' + Date.now() + "_" + file.name);
                        const snapshot = await ruleazaFirebase(storageRef.put(file));
                        entry.foto = await snapshot.ref.getDownloadURL();
                    }

                    if (selectedId) {
                        await ruleazaFirebase(database.ref('utilaje/' + finalId + '/istoric').push(entry));
                        await ruleazaFirebase(database.ref('utilaje/' + finalId + '/model').set(document.getElementById('model').value));
                        await ruleazaFirebase(database.ref('utilaje/' + finalId + '/sectie').set(document.getElementById('sectie').value));
                        
                        const dataPunereVal = document.getElementById('data-punere').value;
                        if(dataPunereVal) await ruleazaFirebase(database.ref('utilaje/' + finalId + '/dataPunere').set(dataPunereVal));
                        if(entry.foto) await ruleazaFirebase(database.ref('utilaje/' + finalId + '/imagine').set(entry.foto));

                    } else {
                        const utilajNouObject = {
                            id: finalId, nume: document.getElementById('nume').value,
                            model: document.getElementById('model').value, sectie: document.getElementById('sectie').value,
                            lat: parseFloat(currentCoords[0]), lng: parseFloat(currentCoords[1]),
                            dataPunere: document.getElementById('data-punere').value,
                            imagine: entry.foto,
                            istoric: { "init": entry }
                        };
                        await ruleazaFirebase(database.ref('utilaje/' + finalId).set(utilajNouObject));
                    }

                    msg.innerText = "✅ SALVAT CU SUCCES ÎN CLOUD!";
                    msg.className = "msg-popup msg-success";

                } catch (err) {
                    if (err.message === "TIMEOUT_FIREBASE") {
                        console.warn("Conexiune înceată! Forțăm salvarea pe dispozitiv.");
                        fortamOffline = true; 
                    } else {
                        throw err; 
                    }
                }
            }

            if (!esteOnline || fortamOffline) {
                let coada = JSON.parse(localStorage.getItem('coada_sincronizare')) || [];
                
                coada.push({
                    isNew: !selectedId,
                    id: finalId,
                    nume: document.getElementById('nume').value,
                    model: document.getElementById('model').value,
                    sectie: document.getElementById('sectie').value,
                    lat: currentCoords ? parseFloat(currentCoords[0]) : null,
                    lng: currentCoords ? parseFloat(currentCoords[1]) : null,
                    entryData: entry
                });
                
                localStorage.setItem('coada_sincronizare', JSON.stringify(coada));

                msg.innerText = fortamOffline ? "⚠️ REȚEA LENTĂ! Salvat local." : "⚠️ SALVAT PE TELEFON!";
                msg.className = "msg-popup msg-error";
                msg.style.borderColor = "#f39c12"; msg.style.color = "#f39c12";
            }

            msg.style.display = "block";

            setTimeout(() => {
                resetForm();
                btn.innerText = "💾 SALVEAZĂ FIȘA";
                btn.disabled = false;
                msg.style.display = "none";
            }, 3000);

        } catch (e) {
            msg.innerText = "❌ EROARE: " + e.message;
            msg.className = "msg-popup msg-error";
            msg.style.display = "block";
            btn.disabled = false;
            btn.innerText = "💾 ÎNCEARCĂ DIN NOU";
        }
    }

    function resetForm() {
        selectedId = null; 
        currentCoords = null;
        
        document.getElementById('form-container').style.display = 'none';
        
        document.getElementById('nume').value = ""; 
        document.getElementById('model').value = ""; 
        document.getElementById('obs').value = ""; 
        document.getElementById('mecanic').value = "";
        document.getElementById('data-punere').value = "";
        document.getElementById('data-punere').disabled = false;
        document.getElementById('status').innerHTML = "MOD: UTILAJ NOU"; 
        document.getElementById('status').className = "status-badge"; 
        document.getElementById('deleteZone').innerHTML = "";
        document.getElementById('fotoUtilaj').value = "";
        
        if (activeMarker) map.removeLayer(activeMarker); 

        refreshPini();
        toggleExtra(); 
        checkReady();
    }

    toggleExtra(); 
    
    window.onload = () => { 
        setTimeout(() => {
            map.invalidateSize();
        }, 500); 
    };

    function executCuProtectie(functieDeExecutat) {
        if (!navigator.onLine) {
            functieDeExecutat();
            return;
        }

        const parolaConfirmare = prompt("Acțiune restricționată! Introdu parola de Administrator:");
        if (!parolaConfirmare) return; 

        const user = firebase.auth().currentUser;
        if (!user) {
            alert("❌ Eroare: Nu ești logat în sistem.");
            return;
        }

        const btn = document.getElementById('saveBtn');
        if (btn) btn.innerText = "⏳ VERIFICARE PAROLĂ...";

        const credential = firebase.auth.EmailAuthProvider.credential(user.email, parolaConfirmare);

        user.reauthenticateWithCredential(credential).then(() => {
            functieDeExecutat();
        }).catch((error) => {
            alert("❌ Acces refuzat! Parolă incorectă sau rețea blocată.");
            if (btn) {
                btn.innerText = "💾 SALVEAZĂ FIȘA";
                btn.disabled = false;
            }
        });
    }

    function verificareSalvare() {
        if (!selectedId) executCuProtectie(salveaza);
        else salveaza();
    }

    function updateConnectionStatus() {
        const cloudBanner = document.querySelector('.cloud-status');
        if (navigator.onLine) {
            cloudBanner.classList.remove('offline');
            cloudBanner.innerHTML = '<div class="dot"></div> CLOUD ONLINE & ACTIV';
            sincronizeazaDatele(); 
        } else {
            cloudBanner.classList.add('offline');
            cloudBanner.innerHTML = '<div class="dot" style="background:#e74c3c; animation:none;"></div> OFFLINE - SALVĂM PE TELEFON';
        }
    }

    async function sincronizeazaDatele() {
        let coada = JSON.parse(localStorage.getItem('coada_sincronizare')) || [];
        if (coada.length === 0) return; 

        console.log(`Încep sincronizarea a ${coada.length} fișe...`);
        
        for (let i = 0; i < coada.length; i++) {
            const item = coada[i];
            try {
                if (item.isNew) {
                    const utilajNouObject = { 
                        id: item.id, nume: item.nume, model: item.model, sectie: item.sectie, 
                        lat: item.lat, lng: item.lng, istoric: { "init": item.entryData } 
                    };
                    await database.ref('utilaje/' + item.id).set(utilajNouObject);
                } else {
                    await database.ref('utilaje/' + item.id + '/istoric').push(item.entryData);
                    await database.ref('utilaje/' + item.id + '/model').set(item.model);
                    await database.ref('utilaje/' + item.id + '/sectie').set(item.sectie);
                }
            } catch (error) {
                console.error("Eroare sync:", error);
                return; 
            }
        }

        localStorage.removeItem('coada_sincronizare');
        alert("✅ Datele salvate offline au fost sincronizate cu succes în Cloud!");
    }

    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    updateConnectionStatus(); 
</script>
</body>
