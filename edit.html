<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrare - Killer SRL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        if (sessionStorage.getItem('access_granted') !== 'true') {
            window.location.href = 'index.html';
        }

        let timeout;
        
        function resetTimer() {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                sessionStorage.removeItem('access_granted');
                window.location.href = 'index.html';
            }, 1800000); // Auto-logout după 30 minute
        }

        window.onmousemove = resetTimer;
        window.onkeypress = resetTimer;

        window.onbeforeunload = function() {
            const numeField = document.getElementById('nume').value;
            if (numeField !== "") {
                return "Ai date nesalvate care se vor pierde!";
            }
        };
    </script>

    <style>
        /* Variabile de culoare */
        :root {
            --primary: #2c3e50;
            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --text: #ecf0f1;
            --text-dim: #bdc3c7;
        }

        /* Setări generale Body */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: #1a1a1a;
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Bara laterală stânga */
        #sidebar {
            width: 420px;
            height: 100vh;
            background: var(--primary);
            padding: 25px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        /* Logo */
        .logo-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-box img {
            max-width: 120px;
        }

        /* Butoane de navigare sus */
        .nav-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-nav {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
/* STATUS CLOUD (BULINA) */
        .cloud-status { 
            background: rgba(39, 174, 96, 0.1); 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            color: var(--success); 
            margin-bottom: 20px; 
            border: 1px solid var(--success); 
        }
        .dot { 
            width: 7px; 
            height: 7px; 
            background: var(--success); 
            border-radius: 50%; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 
            0% { opacity: 0.4; } 
            50% { opacity: 1; } 
            100% { opacity: 0.4; } 
        }
        /* Buton adăugare utilaj nou */
        .btn-add-new {
            background: var(--accent);
            color: #000;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 13px;
        }

        /* Etichetă Status Curent */
        .status-badge {
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border-left: 5px solid var(--accent);
            background: rgba(0,0,0,0.2);
        }

        .status-edit {
            border-left-color: #3498db;
            color: #3498db;
        }

        /* Grupuri de input-uri */
        .group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        /* Zona de bife (Checklist) */
        .checklist {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px dashed rgba(255,255,255,0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .check-item input {
            width: auto;
            margin: 0;
        }

        /* Butoane de acțiune */
        .btn-save {
            background: var(--success);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-save:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .btn-del {
            background: none;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            margin-top: 15px;
        }

        /* Feedback Popup */
        .msg-popup {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .msg-success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #27ae60;
        }

        .msg-error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #c0392b;
        }

        /* Harta Leaflet */
        #map {
            flex: 1;
            background: #222;
            cursor: crosshair;
        }

        .existing-pin {
            filter: hue-rotate(150deg) brightness(1.2);
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="logo-box">
        <img src="logo.png" alt="Logo">
    </div>
    
    <div class="nav-header">
        <a href="index.html" class="btn-nav">🏠 PORTAL</a>
        <a href="view.html" class="btn-nav">👁️ VIZUALIZARE</a>
    </div>
<div class="cloud-status">
        <div class="dot"></div> CLOUD ONLINE & ACTIV
    </div>
    <button class="btn-add-new" onclick="resetForm()">➕ ADĂUGARE UTILAJ NOU</button>
    
    <div id="status" class="status-badge">MOD: UTILAJ NOU</div>

    <div class="group">
        <label>Denumire Utilaj</label>
        <input type="text" id="nume" placeholder="Ex: Cuter Seydelmann 330L" oninput="checkReady()">
    </div>
    
    <div class="group">
        <label>Model / Serie</label>
        <input type="text" id="model" placeholder="Ex: SN 16400-1">
    </div>
    
    <div class="group">
        <label>Secție</label>
        <select id="sectie" onchange="toggleExtra()">
            <option value="Tranșare">Tranșare (Feliatoare Bizerba)</option>
            <option value="Injectare">Injectare</option>
            <option value="Tocare">Tocare (Cuter Seydelmann)</option>
            <option value="Fabricație">Fabricație</option>
            <option value="Tratament Termic">Tratament Termic (Celule)</option>
            <option value="Secție Crude">Secție Crude</option>
            <option value="Ambalare Vid">Ambalare Vid</option>
            <option value="Livrare">Livrare (Cântare)</option>
            <option value="Depozitare">Depozitare (Frig)</option>
        </select>
    </div>

    <div class="group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
            <label>Data</label>
            <input type="date" id="data">
        </div>
        <div>
            <label>Tip Intervenție</label>
            <select id="tipInterventie">
                <option value="Mentenanță Preventivă">Preventivă (Plan)</option>
                <option value="Mentenanță Corectivă">Corectivă (Defect)</option>
                <option value="Inspecție Vizuală">Inspecție Săptămânală</option>
            </select>
        </div>
    </div>
    
    <div class="group" style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
        <div>
            <label>Efectuat de (Mecanic):</label>
            <input type="text" id="mecanic" placeholder="Nume mecanic...">
        </div>
        <div>
            <label>Cost (RON):</label>
            <input type="number" id="cost" placeholder="0" min="0">
        </div>
    </div>

    <div id="extraFields"></div>

    <div class="group">
        <label>Observații / Piese înlocuite</label>
        <textarea id="obs" rows="3" placeholder="Ex: Înlocuit ulei Shell Tellus 90..."></textarea>
    </div>

    <button class="btn-save" id="saveBtn" onclick="salveaza()" disabled>💾 SALVEAZĂ FIȘA</button>
    
    <div id="feedbackMsg" class="msg-popup"></div>
    
    <div id="deleteZone"></div>
</div>

<div id="map"></div>

<script>
    // 1. Configurare Firebase
    const firebaseConfig = { 
        databaseURL: "https://killer-mentenanta-default-rtdb.europe-west1.firebasedatabase.app/" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 2. Configurare Hartă Leaflet
    var map = L.map('map', { 
        crs: L.CRS.Simple, 
        minZoom: 0, 
        maxZoom: 3 
    });
    
    L.imageOverlay('harta.jpg', [[0, 0], [1000, 1400]]).addTo(map);
    map.setView([500, 700], 1); 

    // 3. Variabile Globale
    let dbRaw = {};
    let markersGroup = L.layerGroup().addTo(map);
    let activeMarker = null;
    let selectedId = null;
    let currentCoords = null;
    
    // Setăm data de astăzi automat în câmpul Dată
    document.getElementById('data').valueAsDate = new Date();

    // 4. Ascultăm baza de date pentru actualizări în timp real
   database.ref('utilaje').on('value', (snap) => { 
        dbRaw = snap.val() || {}; 
        refreshPini(); 

        // AUTOLOAD DIN QR CODE (CITIRE SCANARE)
        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id');
        
        // Dacă am venit din Scanare și utilajul există, îl încărcăm automat pe ecran!
        if (qrId && dbRaw[qrId] && selectedId !== qrId) {
            incarcaUtilaj(qrId);
        }
    });

    // 5. Funcția pentru afișarea pinilor pe hartă (în modul edit)
    function refreshPini() {
        markersGroup.clearLayers();
        
        Object.keys(dbRaw).forEach(id => {
            const u = dbRaw[id];
            
            if (u.lat && u.lng) {
                const customIcon = L.icon({ 
                    iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png', 
                    className: 'existing-pin', 
                    iconSize: [25, 41], 
                    iconAnchor: [12, 41] 
                });
                
                const m = L.marker([u.lat, u.lng], { icon: customIcon }).addTo(markersGroup);
                
                m.on('click', (e) => { 
                    L.DomEvent.stopPropagation(e); 
                    incarcaUtilaj(id); 
                });
            }
        });
    }

    // 6. Funcția de click pe hartă pentru a adăuga un pin nou
    map.on('click', (e) => {
        // Dacă edităm deja un utilaj existent, nu putem adăuga unul nou din greșeală
        if (selectedId) {
            return; 
        }
        
        currentCoords = [e.latlng.lat.toFixed(0), e.latlng.lng.toFixed(0)];
        
        // Ștergem pinul provizoriu dacă exista deja unul pus
        if (activeMarker) {
            map.removeLayer(activeMarker);
        }
        
        activeMarker = L.marker(e.latlng).addTo(map); 
        
        checkReady();
    });

    // 7. Funcția de încărcare a datelor când dăm click pe un utilaj existent
    function incarcaUtilaj(id) {
        selectedId = id; 
        const u = dbRaw[id];
        
        document.getElementById('nume').value = u.nume; 
        document.getElementById('model').value = u.model || ""; 
        document.getElementById('sectie').value = u.sectie;
        
        document.getElementById('status').innerHTML = `MOD: EDITARE UTILAJ (ID: ${id})`; 
        document.getElementById('status').className = "status-badge status-edit";
        
        // Creăm butonul de ștergere definitivă
        const deleteBtnHtml = `<button class="btn-del" onclick="stergeUtilaj('${id}')">⚠️ ȘTERGE UTILAJ DEFINITIV</button>`;
        document.getElementById('deleteZone').innerHTML = deleteBtnHtml;
        
        if (activeMarker) {
            map.removeLayer(activeMarker);
        }
        
        toggleExtra(); 
        checkReady();
    }

    // 8. BIFE DINAMICE CONFORM PLANULUI 2026
    function toggleExtra() {
        const s = document.getElementById('sectie').value;
        const extraFieldsDiv = document.getElementById('extraFields');
        
        let html = '<label>Operațiuni Plan Mentenanță 2026:</label><div class="checklist">';

        if (s === 'Tocare' || s === 'Injectare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Filtru admisie aer"> Filtru admisie aer</label>
                <label class="check-item"><input type="checkbox" class="task" value="Sistem hidraulic"> Sistem hidraulic</label>
                <label class="check-item"><input type="checkbox" class="task" value="Motor principal"> Motor principal</label>
                <label class="check-item"><input type="checkbox" class="task" value="Transmisie cuva"> Transmisie cuvă (Ulei)</label>
                <label class="check-item"><input type="checkbox" class="task" value="Descarcator pasta"> Descărcător pastă</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curele transmisie"> Curele</label>
            `;
        } else if (s === 'Tranșare') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Benzi transport"> Verificare benzi transport</label>
                <label class="check-item"><input type="checkbox" class="task" value="Tablou electric"> Tablou electric (contacte)</label>
                <label class="check-item"><input type="checkbox" class="task" value="Sistem taiere"> Sistem tăiere (Ascuțire/Gresare)</label>
            `;
        } else if (s === 'Ambalare Vid') {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Ulei Pompa Vid"> Ulei Pompă Vid</label>
                <label class="check-item"><input type="checkbox" class="task" value="Rezistente Lipire"> Rezistențe Lipire</label>
                <label class="check-item"><input type="checkbox" class="task" value="Banda Teflon"> Bandă Teflon</label>
            `;
        } else {
            html += `
                <label class="check-item"><input type="checkbox" class="task" value="Inspectie Vizuala"> Inspecție Vizuală</label>
                <label class="check-item"><input type="checkbox" class="task" value="Verificare Tablou"> Tablou Electric</label>
            `;
        }
        
        html += `</div>`;
        html += `<div class="group" style="margin-top:10px;">`;
        html += `<label>Altă operațiune manuală:</label>`;
        html += `<input type="text" id="extraCheck">`;
        html += `</div>`;
        
        extraFieldsDiv.innerHTML = html;
    }

    // 9. Verificare validitate formular înainte de salvare
    function checkReady() {
        const numeValid = document.getElementById('nume').value.trim().length > 2;
        const areLocatie = (selectedId !== null) || (currentCoords !== null);
        
        const saveBtn = document.getElementById('saveBtn');
        
        if (areLocatie && numeValid) {
            saveBtn.disabled = false;
        } else {
            saveBtn.disabled = true;
        }
    }

    // 10. Ștergerea unui utilaj
    async function stergeUtilaj(id) { 
        const confirmare = confirm("Ești sigur că vrei să ștergi acest utilaj și întregul său istoric?");
        if (confirmare) { 
            await database.ref('utilaje/' + id).remove(); 
            resetForm(); 
        } 
    }

    // 11. Funcția principală de salvare a datelor
    async function salveaza() {
        const btn = document.getElementById('saveBtn'); 
        const msg = document.getElementById('feedbackMsg');
        
        btn.disabled = true; 
        btn.innerText = "⏳ SE SALVEAZĂ...";

        try {
            // Colectăm ce a fost bifat
            const bifeList = document.querySelectorAll('.task:checked');
            const bifeArray = Array.from(bifeList);
            const bifeValues = bifeArray.map(c => c.value);
            const bifeString = bifeValues.join(", ");
            
            // Colectăm valoarea extra scrisă manual
            const extraCheckElement = document.getElementById('extraCheck');
            let manual = "";
            if (extraCheckElement) {
                manual = extraCheckElement.value;
            }
            
            // Creăm șirul final de verificări
            let verificariFinale = bifeString;
            if (manual !== "") {
                if (verificariFinale !== "") {
                    verificariFinale += " | " + manual;
                } else {
                    verificariFinale = manual;
                }
            }
            
            // Colectăm costul
            let costValoare = parseFloat(document.getElementById('cost').value);
            if (isNaN(costValoare)) {
                costValoare = 0;
            }

            // Creăm obiectul pentru intervenție
            const entry = {
                data: document.getElementById('data').value,
                tip: document.getElementById('tipInterventie').value,
                mecanic: document.getElementById('mecanic').value,
                cost: costValoare,
                verificari: verificariFinale,
                obs: document.getElementById('obs').value,
                timestamp: Date.now()
            };

            if (selectedId) {
                // Dacă utilajul există, actualizăm și adăugăm în istoric
                const istoricRef = database.ref('utilaje/' + selectedId + '/istoric').push();
                await istoricRef.set(entry);
                
                await database.ref('utilaje/' + selectedId + '/model').set(document.getElementById('model').value);
                await database.ref('utilaje/' + selectedId + '/sectie').set(document.getElementById('sectie').value);
            } else {
                // Dacă este un utilaj complet nou
                const idGenerat = Math.floor(1000 + Math.random() * 9000);
                const idNou = "K-" + idGenerat;
                
                const utilajNouObject = { 
                    id: idNou, 
                    nume: document.getElementById('nume').value, 
                    model: document.getElementById('model').value, 
                    sectie: document.getElementById('sectie').value, 
                    lat: parseFloat(currentCoords[0]), 
                    lng: parseFloat(currentCoords[1]), 
                    istoric: { 
                        "init": entry 
                    } 
                };
                
                await database.ref('utilaje/' + idNou).set(utilajNouObject);
            }

            // Confirmare de succes
            msg.innerText = "✅ SALVAT CU SUCCES!"; 
            msg.className = "msg-popup msg-success"; 
            msg.style.display = "block";
            
            setTimeout(() => { 
                resetForm(); 
                btn.innerText = "💾 SALVEAZĂ FIȘA"; 
                msg.style.display = "none"; 
            }, 2000);
            
        } catch(e) {
            // Confirmare eroare
            msg.innerText = "❌ EROARE: " + e.message; 
            msg.className = "msg-popup msg-error"; 
            msg.style.display = "block";
            
            btn.disabled = false; 
            btn.innerText = "💾 ÎNCEARCĂ DIN NOU";
        }
    }

    // 12. Resetare formular pentru acțiuni noi
    function resetForm() {
        selectedId = null; 
        currentCoords = null;
        
        document.getElementById('nume').value = ""; 
        document.getElementById('model').value = ""; 
        document.getElementById('obs').value = ""; 
        document.getElementById('mecanic').value = "";
        document.getElementById('cost').value = "";
        
        document.getElementById('status').innerHTML = "MOD: UTILAJ NOU"; 
        document.getElementById('status').className = "status-badge"; 
        document.getElementById('deleteZone').innerHTML = "";
        
        if (activeMarker) {
            map.removeLayer(activeMarker); 
        }
        
        toggleExtra(); 
        checkReady();
    }

    // Inițializare scripturi după ce se încarcă pagina
    toggleExtra(); 
    
    window.onload = () => { 
        setTimeout(() => {
            map.invalidateSize();
        }, 500); 
    };
</script>
</body>
</html>
