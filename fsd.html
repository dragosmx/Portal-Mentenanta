<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editare Pro - Killer SRL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #2c3e50; --accent: #f39c12; --success: #27ae60; --text-dim: #bdc3c7; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; background: #1a1a1a; }
        
        #sidebar { 
            width: 380px; background: var(--primary); color: white; display: flex; flex-direction: column; 
            box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 10; border-right: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 25px; scrollbar-width: none; }
        .logo-box { text-align: center; margin-bottom: 25px; }
        .logo-box img { max-width: 140px; }

        .status-badge { 
            padding: 12px; border-radius: 8px; font-size: 11px; font-weight: bold; 
            margin-bottom: 20px; text-align: center; border-left: 5px solid #7f8c8d; background: rgba(0,0,0,0.2);
        }
        .status-new { border-left-color: var(--accent); }
        .status-edit { border-left-color: var(--success); background: rgba(39, 174, 96, 0.1); }

        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 10px; font-weight: bold; color: var(--text-dim); text-transform: uppercase; }
        input, select, textarea { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.2); color: white; font-size: 14px; box-sizing: border-box; 
        }
        input:focus { border-color: var(--accent); outline: none; }

        .checklist { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-top: 5px; border: 1px dashed rgba(255,255,255,0.1); }
        .check-item { display: flex; align-items: center; font-size: 12px; margin-bottom: 8px; cursor: pointer; }
        .check-item input { width: auto; margin-right: 10px; cursor: pointer; }

        .btn-save { 
            background: var(--success); color: white; font-weight: bold; padding: 16px; border: none; 
            border-radius: 10px; cursor: pointer; text-transform: uppercase; width: 100%; 
            transition: 0.3s; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        .btn-save:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-backup { background: #8e44ad; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 11px; margin-top: 15px; }

        #map { flex: 1; background: #222; cursor: crosshair; }
        .existing-pin { filter: hue-rotate(140deg); }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-content">
        <div class="logo-box"><img src="logo.png"></div>

        <button onclick="conecteazaFisier()" id="btnConnect" style="background:var(--accent); color:white; padding:15px; border:none; border-radius:10px; cursor:pointer; margin-bottom:20px; font-weight:bold; width:100%;">🔗 CONECTEAZĂ BAZA DATE</button>
        
        <div id="status" class="status-badge status-new">MOD: UTILAJ NOU<br>(Click pe hartă pentru locație)</div>

        <div class="group"><label>Nume Utilaj</label><input type="text" id="nume" placeholder="Ex: Injector Gunther" oninput="checkReady()"></div>
        <div class="group"><label>Model / Serie</label><input type="text" id="model" placeholder="Ex: G-350"></div>
        <div class="group"><label>Data Intervenției</label><input type="date" id="data"></div>
        
        <div class="group">
            <label>Secție</label>
            <select id="sectie" onchange="toggleExtra()">
                <option value="Tranșare">Tranșare</option>
                <option value="Injectare">Injectare</option>
                <option value="Tocare">Tocare</option>
                <option value="Fabricație">Fabricație</option>
                <option value="Tratament Termic">Tratament Termic</option>
                <option value="Secție Crude">Secție Crude</option>
                <option value="Ambalare Vid">Ambalare Vid</option>
                <option value="Livrare">Livrare</option>
                <option value="Spălare">Spălare</option>
                <option value="Compresoare Aer">Compresoare Aer</option>
                <option value="Depozitare">Depozitare</option>
            </select>
        </div>

        <div id="extraFields"></div>

        <div class="group"><label>Descriere Detaliată (Obs)</label><textarea id="obs" rows="3"></textarea></div>
        
        <button class="btn-save" id="saveBtn" onclick="salveaza()" disabled>💾 Salvează în Bază</button>
        <button class="btn-backup" onclick="recuperareBackup()">🆘 RECUPEREAZĂ BACKUP BROWSER</button>
        
        <button onclick="resetForm()" style="background:none; border:none; color:var(--text-dim); text-decoration:underline; cursor:pointer; width:100%; font-size:11px; margin-top:20px;">Anulează / Adaugă Utilaj Nou</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map = L.map('map', { crs: L.CRS.Simple, minZoom: -1 });
    L.imageOverlay('harta.jpg', [[0, 0], [1000, 1400]]).addTo(map);
    map.fitBounds([[0, 0], [1000, 1400]]);
    
    let fileHandle, activeMarker, existingGroup = L.layerGroup().addTo(map);
    let selectedId = null, currentCoords = null;
    document.getElementById('data').valueAsDate = new Date();

    map.on('click', e => {
        if(selectedId) return; 
        currentCoords = [e.latlng.lat.toFixed(0), e.latlng.lng.toFixed(0)];
        if(activeMarker) map.removeLayer(activeMarker);
        activeMarker = L.marker(e.latlng).addTo(map);
        checkReady();
    });

    async function conecteazaFisier() {
        try {
            [fileHandle] = await window.showOpenFilePicker();
            document.getElementById('btnConnect').innerText = "✅ CONECTAT";
            document.getElementById('btnConnect').style.background = "#27ae60";
            refreshPini();
            checkReady();
        } catch(e) {}
    }

    async function refreshPini() {
        const file = await fileHandle.getFile();
        const db = JSON.parse(await file.text() || "[]");
        existingGroup.clearLayers();
        db.forEach(u => {
            const m = L.marker([u.lat, u.lng], {
                icon: L.icon({ iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png', className: 'existing-pin', iconSize: [25, 41], iconAnchor: [12, 41] })
            }).addTo(existingGroup);
            m.on('click', (e) => { 
                L.DomEvent.stopPropagation(e);
                selectedId = u.id;
                document.getElementById('nume').value = u.nume;
                document.getElementById('model').value = u.model || "";
                document.getElementById('sectie').value = u.sectie;
                document.getElementById('status').innerHTML = `MOD: EDITARE ID: ${u.id}<br><b>${u.nume}</b>`;
                document.getElementById('status').className = "status-badge status-edit";
                if(activeMarker) map.removeLayer(activeMarker);
                toggleExtra();
                checkReady();
            });
        });
    }

    function toggleExtra() {
        const sectie = document.getElementById('sectie').value;
        const extra = document.getElementById('extraFields');
        let html = "";

        // PROFILE DINAMICE
        if (sectie === 'Tratament Termic' || sectie === 'Secție Crude') {
            html = `<div class="group"><label>Verificări Celulă:</label><div class="checklist">
                <label class="check-item"><input type="checkbox" class="task" value="Sonde"> Sonde</label>
                <label class="check-item"><input type="checkbox" class="task" value="Clapete"> Clapete</label>
                <label class="check-item"><input type="checkbox" class="task" value="Generator"> Generator Fum</label>
                <label class="check-item"><input type="checkbox" class="task" value="Garnituri"> Garnituri</label>
            </div></div>`;
        } else if (['Tocare', 'Injectare', 'Fabricație', 'Tranșare'].includes(sectie)) {
            html = `<div class="group"><label>Verificări Mecanice:</label><div class="checklist">
                <label class="check-item"><input type="checkbox" class="task" value="Ulei/Vaselina"> Nivel Ulei/Vaselină</label>
                <label class="check-item"><input type="checkbox" class="task" value="Lanturi/Curele"> Lanțuri/Curele</label>
                <label class="check-item"><input type="checkbox" class="task" value="Cutite/Site"> Cuțite/Site</label>
                <label class="check-item"><input type="checkbox" class="task" value="Rulmenti"> Zgomot Rulmenți</label>
            </div></div>`;
        } else if (sectie === 'Ambalare Vid') {
            html = `<div class="group"><label>Verificări Ambalare:</label><div class="checklist">
                <label class="check-item"><input type="checkbox" class="task" value="Pompa Vid"> Pompă Vid</label>
                <label class="check-item"><input type="checkbox" class="task" value="Rezistenta Lipire"> Rezistență Lipire</label>
                <label class="check-item"><input type="checkbox" class="task" value="Senzori"> Senzori</label>
            </div></div>`;
        } else {
            html = `<div class="group"><label>Verificări Generale:</label><div class="checklist">
                <label class="check-item"><input type="checkbox" class="task" value="Vizual"> Inspecție Vizuală</label>
                <label class="check-item"><input type="checkbox" class="task" value="Curatenie"> Curățenie/Igienă</label>
            </div></div>`;
        }

        // Câmp extra pentru orice altceva
        html += `<div class="group"><label>Altă verificare (Custom):</label><input type="text" id="extraCheck" placeholder="Ex: Presiune aer"></div>`;
        extra.innerHTML = html;
    }

    function checkReady() {
        const hasLoc = selectedId || currentCoords;
        const hasName = document.getElementById('nume').value.length > 2;
        document.getElementById('saveBtn').disabled = !(fileHandle && hasLoc && hasName);
    }

    async function salveaza() {
        const f = await fileHandle.getFile();
        let db = JSON.parse(await f.text() || "[]");
        
        // Colectare bife + camp custom
        let verificari = Array.from(document.querySelectorAll('.task:checked')).map(c => c.value).join(", ");
        const custom = document.getElementById('extraCheck').value;
        if(custom) verificari += (verificari ? ", " : "") + custom;

        const entry = {
            data: document.getElementById('data').value,
            obs: document.getElementById('obs').value,
            verificari: verificari
        };

        if(selectedId) {
            let u = db.find(x => x.id === selectedId);
            if(!u.istoric) u.istoric = [];
            u.istoric.push(entry);
            u.model = document.getElementById('model').value;
        } else {
            let nr = db.length + 1;
            let newID = "ID" + nr.toString().padStart(3, '0');
            while(db.some(x => x.id === newID)) { nr++; newID = "ID" + nr.toString().padStart(3, '0'); }
            
            db.push({
                id: newID, nume: document.getElementById('nume').value, model: document.getElementById('model').value,
                sectie: document.getElementById('sectie').value, lat: parseFloat(currentCoords[0]), lng: parseFloat(currentCoords[1]),
                istoric: [entry]
            });
        }

        // BACKUP BROWSER
        localStorage.setItem('backup_killer_srl', JSON.stringify(db));

        const wr = await fileHandle.createWritable();
        await wr.write(JSON.stringify(db, null, 2));
        await wr.close();
        
        alert("Salvat cu succes!");
        resetForm();
        refreshPini();
    }

    function resetForm() {
        selectedId = null; currentCoords = null;
        document.getElementById('nume').value = ""; document.getElementById('obs').value = "";
        document.getElementById('status').innerHTML = `MOD: UTILAJ NOU<br>(Click pe hartă pentru locație)`;
        document.getElementById('status').className = "status-badge status-new";
        if(activeMarker) map.removeLayer(activeMarker);
        toggleExtra();
        checkReady();
    }

    function recuperareBackup() {
        const b = localStorage.getItem('backup_killer_srl');
        if(b) {
            const blob = new Blob([b], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "BACKUP_MENTENANTA.json";
            a.click();
        } else { alert("Nu există backup!"); }
    }

    // Inițializare bife la pornire
    toggleExtra();
</script>
</body>
</html>
