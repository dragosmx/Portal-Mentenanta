            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback);
        }
*/
      function pornesteScanner() {
        document.getElementById("scanner-modal").classList.add("activ");

        html5QrCode = new Html5Qrcode("reader"); // Inițializare globală
        html5QrCode
          .start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            (decodedText) => {
              // 1. Oprim camera prima dată
              inchideScanner();

              // 2. Facem redirecționarea (Scoatem alert-ul)
              // Dacă în QR este un link complet (cum e în poza ta):
              if (decodedText.startsWith("http")) {
                window.location.href = decodedText;
              } else {
                // Dacă în QR este scris doar "K-1111":
                // Te duce automat în pagina scan.html
                window.location.href = "scan.html?id=" + decodedText;
              }
            },
            (err) => {
              /* erorile de focus ale camerei le ignorăm */
            },
          )
          .catch((err) => alert("Eroare cameră: " + err));
      }

      function inchideScanner() {
        if (html5QrCode) {
          html5QrCode
            .stop()
            .then(() => {
              document
                .getElementById("scanner-modal")
                .classList.remove("activ");
            })
            .catch((err) => {
              document
                .getElementById("scanner-modal")
                .classList.remove("activ");
            });
        }
      }
      function calculeazaZile(dataInstalare) {
        if (!dataInstalare) return 999;
        const oZi = 24 * 60 * 60 * 1000;
        const azi = new Date();
        const dataR = new Date(dataInstalare);
        return Math.floor(Math.abs(azi - dataR) / oZi);
      }

      // 🚀 REPARATĂ: Conectează Firebase direct la funcția de procesare
      function pornesteAscultareAlarme() {
        // 🔒 1. VERIFICĂM ROLUL: Dacă e operator, oprim funcția aici și ascundem clopoțelul!
        const rol = sessionStorage.getItem("user_rol");
        if (rol === "operator") {
          const btnClopotel = document.getElementById("btn-clopotel");
          if (btnClopotel) btnClopotel.style.display = "none";
          return; // Ne oprim, nu mai ascultăm nicio alarmă!
        }

        const configuratieAlarme = {
          9728: 30,
          6355: 30,
          1111: 14,
          2222: 14,
          3333: 14,
          4444: 14,
          9902: 14,
        };

        // 1. Verificăm dacă suntem OFFLINE (Fără internet)
        if (!navigator.onLine) {
          const backup = localStorage.getItem("backup_utilaje");
          if (backup) {
            dbRaw = JSON.parse(backup);
            verificaAlarmeMentenanta();
            console.log("⚠️ Index offline: Alarme încărcate din memorie.");
          }
          return; // Ne oprim aici, nu mai încercăm să comunicăm cu Firebase
        }

        // 2. Dacă suntem ONLINE (Avem internet)
        // 🛡️ Așteptăm aprobarea serverului înainte de a cere alarmele live
        firebase.auth().onAuthStateChanged((user) => {
          if (user) {
            firebase
              .database()
              .ref("utilaje")
              .on("value", (snapshot) => {
                dbRaw = snapshot.val() || {};

                // 💾 SALVĂM datele în telefon în caz că pică netul mai târziu
                localStorage.setItem("backup_utilaje", JSON.stringify(dbRaw));

                verificaAlarmeMentenanta();
              });
          }
        });
      }
      // --- START TRADUCĂTOR DATE ---
      function obtineTimp(dataString) {
        if (!dataString || dataString === "-" || dataString.trim() === "")
          return 0;
        const curat = dataString.replace(/[^0-9./-]/g, "").trim();
        const part = curat.split(/[./-]/);
        if (part.length < 3) return 0;

        let d, m, y;
        if (part[0].length === 4) {
          [y, m, d] = part;
        } else {
          [d, m, y] = part;
        }

        return new Date(y, m - 1, d).getTime();
      }

      function calculeazaZile(dataString) {
        const timp = obtineTimp(dataString);
        if (timp === 0) return 999;
        const dt = new Date(timp);
        const azi = new Date();
        azi.setHours(0, 0, 0, 0);
        const diff = Math.floor((azi - dt) / 86400000);
        return isNaN(diff) ? 999 : diff < 0 ? 0 : diff;
      }

      function gasesteUltimaRevizie(istoric) {
        if (!istoric) return null;
        let revizii = Object.values(istoric).filter((i) => i.revizie === true);
        if (revizii.length === 0) return null;

        revizii.sort((a, b) => obtineTimp(b.data) - obtineTimp(a.data));
        return revizii[0];
      }
      // --- END TRADUCĂTOR DATE ---
      function verificaAlarmeMentenanta() {
        if (!dbRaw) return;
        const alertPanel = document.getElementById("alert-panel");
        const container = document.getElementById("alert-list"); // Am schimbat în alert-list (trebuie să corespundă cu ID-ul din HTML)
        const btnClopotel = document.getElementById("btn-clopotel");

        if (!alertPanel || !container) return;

        container.innerHTML = "";
        let areAlerte = false;

        // Tabelul de configurare inclus direct ca să nu mai dea erori
        // const configuratieAlarme = { "9728": 30, "6355": 30, "1111": 14, "2222": 14, "3333": 14, "4444": 14, "5061": 14 };

        Object.keys(dbRaw).forEach((id) => {
          const u = dbRaw[id];
          const ultimaRev = gasesteUltimaRevizie(u.istoric);

          if (ultimaRev) {
            const z = calculeazaZile(ultimaRev.data);

            const idFaraK = id.replace("K-", "");
            const limitaZile =
              configuratieAlarme[id] || configuratieAlarme[idFaraK] || 30;

            // Debug
            console.log(`DEBUG: ID=${id} | Limita gasita=${limitaZile}`);

            if (z >= limitaZile) {
              areAlerte = true;
              const esteCritic = z >= limitaZile * 3;
              const clasaAlerta = esteCritic ? "alert-urgent" : "alert-warning";
              const statusMesaj = esteCritic
                ? `CRITIC: Revizie depășită de ${z} zile!`
                : `ATENȚIE: Au trecut ${z} zile de la ultima revizie!`;

              container.innerHTML += `
                        <div class="alert-item ${clasaAlerta}">
                            <b style="font-size: 14px; display:block;">${u.nume}</b>
                            <span style="font-size: 10px; color: #ccc;">Secția: ${u.sectie} | ID: ${id}</span>
                            <div style="margin-top: 5px; font-weight: bold; font-size: 13px;">⚠️ ${statusMesaj}</div>
                            
                            <div style="display:flex; gap:5px; margin-top:10px;">
                                <a href="view.html?id=${id}" class="btn-locate" style="flex:1; text-decoration:none; text-align:center; padding: 8px 5px; display:flex; align-items:center; justify-content:center; box-sizing:border-box;">📍 HARTĂ</a>
                                <a href="edit.html?id=${id}" class="btn-locate" style="flex:1; background:#8e44ad; text-decoration:none; text-align:center; padding: 8px 5px; display:flex; align-items:center; justify-content:center; box-sizing:border-box;">🔧 REPARĂ</a>
                            </div>
                        </div>`;
            }
          }
        });

        if (areAlerte) {
          if (!alertaInchisaManual) {
            alertPanel.classList.remove("alert-hidden");
            alertPanel.classList.add("activ");
            if (btnClopotel) btnClopotel.style.display = "none";
          } else {
            alertPanel.classList.add("alert-hidden");
            alertPanel.classList.remove("activ");
            if (btnClopotel) btnClopotel.style.display = "flex";
          }
        } else {
          alertPanel.classList.add("alert-hidden");
          alertPanel.classList.remove("activ");
          if (btnClopotel) btnClopotel.style.display = "none";
        }
      }
      function inchideAlarmaManual() {
        alertaInchisaManual = true;
        document.getElementById("alert-panel").classList.add("alert-hidden");
        const btn = document.getElementById("btn-clopotel");
        if (btn) btn.style.display = "flex";
      }

      function deschideAlarmaManual() {
        alertaInchisaManual = false;
        document.getElementById("alert-panel").classList.remove("alert-hidden");
        const btn = document.getElementById("btn-clopotel");
        if (btn) btn.style.display = "none";
      }
      // Deschide fereastra cu arhiva de tickete rezolvate
      function deschideArhivaTickete() {
        document.getElementById("modalArhivaTickete").style.display = "flex";
        const container = document.getElementById("corpArhivaTickete");
        container.innerHTML =
          "<p style='text-align:center; color:#aaa; font-size:12px; margin-top:20px;'>⏳ Se încarcă arhiva...</p>";

        // Tragem datele din ramura 'sesizari'
        firebase
          .database()
          .ref("sesizari")
          .once("value")
          .then((snapshot) => {
            const sesizari = snapshot.val() || {};
            container.innerHTML = "";

            let areRezolvate = false;
            const intrari = Object.entries(sesizari);
            // Sortăm să fie cele mai noi reparații primele
            intrari.sort(
              (a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0),
            );

            intrari.forEach(([key, s]) => {
              if (s.status === "rezolvat") {
                areRezolvate = true;
                container.innerHTML += `
                    <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border-left: 4px solid #2ecc71; font-size: 12px; border-top:1px solid rgba(255,255,255,0.05);">
                        <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px;">
                            <span style="color: #fff; font-size: 13px;">⚙️ ${s.numeUtilaj} (ID: ${s.utilajId})</span>
                            <span style="color: #2ecc71; font-size: 10px; background:rgba(46,204,113,0.1); padding:2px 6px; border-radius:3px;">REPARAT</span>
                        </div>
                        <div style="color: #a0a0a0; font-size: 10px; margin-bottom: 6px;">
                            📍 ${s.sectie} | Raportat de: <b>${s.raportatDe}</b> la data: ${s.dataTrimiterii}
                        </div>
                        <div style="color: #bdc3c7; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 4px; font-style: italic;">
                            💬 Defect raportat: ${s.problema}
                        </div>
                    </div>
                `;
              }
            });

            if (!areRezolvate) {
              container.innerHTML =
                "<p style='text-align:center; color:#aaa; font-size:12px; margin-top:20px;'>Nicio sesizare închisă în arhivă.</p>";
            }
          })
          .catch((err) => {
            container.innerHTML =
              "<p style='text-align:center; color:#e74c3c; font-size:12px; margin-top:20px;'>❌ Eroare la încărcare.</p>";
            console.error(err);
          });
      }

      function inchideArhivaTickete() {
        document.getElementById("modalArhivaTickete").style.display = "none";
      }
    </script>
    <div class="footer-dev">Developed by Dragos Munteanu • 2026</div>

        onclick="inchideScanner()"
        style="
          margin-top: 20px;

          background: var(--danger);
          color: white;
          border: none;
          border-radius: 50px;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
        "
      >
        ❌ ÎNCHIDE SCANNER
      </button>
    </div>
