<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mentenanță - Killer SRL</title>
    <style>
        :root { --primary: #2c3e50; --accent: #f39c12; --success: #27ae60; }
        body { 
            margin: 0; padding: 0; height: 100vh; 
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%); 
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .container { 
            width: 380px; text-align: center; background: rgba(0,0,0,0.4); 
            padding: 40px 30px; border-radius: 25px; backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
        }
        img { max-width: 160px; margin-bottom: 20px; }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; font-size: 20px; color: #eee; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .btn { 
            padding: 15px 10px; border-radius: 12px; border: none; cursor: pointer; 
            font-weight: bold; font-size: 12px; transition: 0.3s; text-decoration: none; color: white;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .btn-view { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-edit { background: var(--primary); border: 1px solid #34495e; }
        .btn:hover { transform: translateY(-3px); background: var(--accent); }
        
        #passArea { 
            display: none; margin-top: 10px; padding-top: 15px; 
            border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .input-pass { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.5); color: white; text-align: center; font-size: 14px; 
            box-sizing: border-box; outline: none; margin-bottom: 10px;
        }
        .btn-login { background: var(--success); color: white; width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }

        .footer-dev { position: absolute; bottom: 20px; font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Killer SRL">
        <h1>MENTENANȚĂ TEHNICĂ</h1>
        
        <div class="menu-grid">
            <a href="view.html" class="btn btn-view">
                <span style="font-size: 20px;">👁️</span> VIZUALIZARE
            </a>
            <div id="adminBtn" class="btn btn-edit" onclick="showPass()">
                <span style="font-size: 20px;">⚙️</span> ADMINISTRARE
            </div>
        </div>

        <div id="passArea">
            <input type="password" id="passInput" class="input-pass" placeholder="Introduceți parola">
            <button class="btn-login" onclick="checkPass()">AUTENTIFICARE</button>
        </div>
    </div>

    <div class="footer-dev">Developed by Dragos Munteanu • 2026</div>

    <script>
        // Arată câmpul de parolă
        function showPass() {
            document.getElementById('passArea').style.display = 'block';
            document.getElementById('passInput').focus();
            // Opțional: ascundem butonul de administrare după ce apare parola
            document.getElementById('adminBtn').style.opacity = '0.5';
        }

        // Verifică parola și setează sesiunea
        function checkPass() {
            const valoareIntrodusa = document.getElementById('passInput').value;
            const parolaCorecta = 'killer2026';

            if (valoareIntrodusa === parolaCorecta) {
                // IMPORTANT: Salvăm permisiunea în browser
                sessionStorage.setItem('access_granted', 'true');
                
                // Schimbăm textul butonului să știi că a mers
                document.querySelector('.btn-login').innerText = "ACCES PERMIS! Redirecționare...";
                document.querySelector('.btn-login').style.background = "#27ae60";

                // Redirecționăm după o scurtă pauză
                setTimeout(() => {
                    window.location.href = 'edit.html';
                }, 500);
            } else {
                alert('Parolă incorectă!');
                document.getElementById('passInput').value = '';
                document.getElementById('passInput').focus();
            }
        }

        // Permite Enter
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPass();
            }
        });
    </script>
</body>
</html>
