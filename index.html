<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mentenanță - Killer SRL</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mentenanță">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60; /* SCHIMBAT ÎN VERDE KILLER */
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg-dark: #1a1a1a;
            --text: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            font-family: 'Segoe UI', sans-serif;
            color: var(--text);
        }

        .container {
            background: var(--primary);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border-top: 6px solid var(--accent); /* LINIA DE SUS ACUM E VERDE */
        }

        .logo-box img {
            max-width: 160px;
            margin-bottom: 20px;
        }

        h2 { margin: 0 0 5px 0; font-size: 22px; }
        p { margin: 0 0 25px 0; font-size: 13px; color: #bdc3c7; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; margin-bottom: 5px; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
        
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            letter-spacing: 3px;
            transition: 0.3s;
        }
        
        input[type="password"]:focus { border-color: var(--accent); }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-login { background: var(--accent); color: white; } /* Butonul de login e acum tot verde */
        .btn-login:hover { background: #219653; }
        
        .btn-edit { background: #34495e; color: white; border: 1px solid rgba(255,255,255,0.1); }
        .btn-edit:hover { background: #2c3e50; }
        
        .btn-view { background: #34495e; color: white; border: 1px solid rgba(255,255,255,0.1); }

        .error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }

        #menu-screen { display: none; }
        .footer-dev { position: absolute; bottom: 20px; font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }

    </style>
</head>

<script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Aplicație PWA activată cu succes!'))
                .catch(err => console.log('Eroare PWA: ', err));
            });
        }
    </script>
<body>

<div class="container">
    <div class="logo-box">
        <img src="logo.png" alt="Logo Killer SRL">
    </div>

    <div id="login-screen">
        <h2>Sistem Mentenanță</h2>
        <p>Acces securizat pentru echipa tehnică</p>
        
        <div class="input-group">
            <input type="password" id="passInput" placeholder="••••••••" onkeyup="if(event.key==='Enter') verificaParola()">
        </div>
        
        <div id="errorMsg" class="error-msg">❌ Parolă incorectă!</div>
        
        <button class="btn btn-login" onclick="verificaParola()">🔐 INTRĂ ÎN SISTEM</button>
    </div>

    <div id="menu-screen">
        <h2>Salut!</h2>
        <p>Alege secțiunea dorită:</p>
        
        <a href="edit.html" class="btn btn-edit" style="border-left: 4px solid var(--accent);">🛠️ Gestiune</a>
        <a href="view.html" class="btn btn-view" style="border-left: 4px solid var(--accent);">📊 Centru de Control Mentenanță </a>
        
        <button class="btn" style="background:transparent; border:1px solid var(--danger); color:var(--danger); margin-top:20px;" onclick="logout()">Ieșire</button>
    </div>
    <div id="mobile-qr-section" style="margin-top: 20px; text-align: center;">
    <button onclick="pornesteScanner()" style="background: #8e44ad; color: white; padding: 15px; border: none; border-radius: 12px; font-weight: bold; width: 100%; max-width: 300px; cursor: pointer;">
        📷 SCANEAZĂ COD QR UTILAJ
    </button>
</div>

<div id="reader" style="width: 100%; max-width: 500px; margin: 20px auto; display: none; border-radius: 15px; overflow: hidden;"></div>
</div>
 <div class="footer-dev">Developed by Dragos Munteanu • 2026</div>

<script>
    const PAROLA_CORECTA = "killer2026";

    window.onload = function() {
        if (sessionStorage.getItem('access_granted') === 'true') {
            afiseazaMeniuSauRedirectioneaza();
        }
    };

    function verificaParola() {
        const pass = document.getElementById('passInput').value;
        if (pass === PAROLA_CORECTA) {
            sessionStorage.setItem('access_granted', 'true');
            afiseazaMeniuSauRedirectioneaza();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('passInput').value = "";
        }
    }

    function afiseazaMeniuSauRedirectioneaza() {
        const urlParams = new URLSearchParams(window.location.search);
        const refParams = urlParams.get('ref');
        if (refParams) {
            window.location.href = "edit.html" + refParams;
        } else {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }
    }

    function logout() {
        sessionStorage.removeItem('access_granted');
        location.reload();
    }
    function pornesteScanner() {
    document.getElementById('reader').style.display = 'block';
    const html5QrCode = new Html5Qrcode("reader");
    
    const qrCodeSuccessCallback = (decodedText, decodedResult) => {
        // decodedText va fi link-ul tau de genul .../scan.html?id=K1234
        window.location.href = decodedText; 
        html5QrCode.stop();
    };
    
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    // Pornim camera din spate (environment)
    html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback);
}
</script>
</body>
</html>
