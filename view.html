        .custom-pin {
    /* Eliminăm orice tranziție de pe containerul principal ca să nu miște harta */
    transition: none !important; 
    pointer-events: auto;
}

.custom-pin svg {
    /* Aplicăm animația doar pe desenul din interior */
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    will-change: transform, filter; /* Spunem browserului să folosească placa video */
    transform-origin: bottom center; /* Se mărește de jos în sus, nu din mijloc */
    display: block;
}

/* Efectul de Hover - Modificat să fie extrem de clar */
.custom-pin:hover svg {
    transform: scale(1.15); /* Nu exagerăm cu mărirea ca să păstrăm claritatea */

<script>
  
    const firebaseConfig = {
        apiKey: "AIzaSyBHfyZzJ-GUfUUqEidMytaCSh-B2SYh1Ks",
        authDomain: "killer-mentenanta.firebaseapp.com",
        databaseURL: "https://killer-mentenanta-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "killer-mentenanta",
        storageBucket: "killer-mentenanta.firebasestorage.app",
        messagingSenderId: "434460062600",
        appId: "1:434460062600:web:38a2ff00266c3c1dff403d"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let dbRaw = {};
    let selectedId = null;
    let markersList = [];
 
    function calculeazaZile(dataString) {
    if (!dataString || dataString === "-" || dataString.trim() === "") return 999;
    
    // Curățăm orice spațiu sau caracter ciudat
    const curat = dataString.replace(/[^0-9./-]/g, '').trim();
    const part = curat.split(/[./-]/);
    
    if (part.length < 3) return 999;

    let d, m, y;
    if (part[0].length === 4) { [y, m, d] = part; } // Format YYYY-MM-DD
    else { [d, m, y] = part; } // Format DD.MM.YYYY

    const dt = new Date(y, m - 1, d);
    const azi = new Date();
    azi.setHours(0,0,0,0);
    
    const diff = Math.floor((azi - dt) / 86400000);
    return isNaN(diff) ? 999 : (diff < 0 ? 0 : diff);
    }

    // 4. CONFIGURARE HARTĂ
    var map = L.map('map', { crs: L.CRS.Simple, minZoom: 0, maxZoom: 3, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.imageOverlay('harta.jpg', [[0, 0], [1000, 1400]]).addTo(map);
    map.setView([500, 700], 0.5);

    /*dbRaw = {}, markersList = [];*/

    // 5. SINCRONIZARE DATE
    database.ref('utilaje').on('value', (snap) => {
        dbRaw = snap.val() || {};
        afiseazaPuncte();
        verificaAlarmeMentenanta();
        document.getElementById('loading-screen').style.display = 'none';
    });
    setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 4000);

    // 6. AFIȘARE PIN-URI (Bazat strict pe ultima Revizie Bifată)
    function afiseazaPuncte() {
    const filtru = document.getElementById('filterSectie').value;
    markersList.forEach(m => map.removeLayer(m)); 
    markersList = [];

    Object.keys(dbRaw).forEach(id => {
        const u = dbRaw[id];
        if (filtru !== "Toate" && u.sectie !== filtru) return;
        if (!u.lat || !u.lng) return;

        // --- 1. LOGICA DE SELECȚIE (AICI SE FACE MAGIA) ---
        // Verificăm dacă ID-ul curent este cel selectat din alarma
        const esteSelectat = (id === selectedId);
        const clasaPin = esteSelectat ? 'custom-pin pin-selectat' : 'custom-pin';

        const istArr = u.istoric ? Object.values(u.istoric).sort((a,b)=>calculeazaZile(a.data)-calculeazaZile(b.data)) : [];
        const ultimaData = istArr[0] ? istArr[0].data : "-";
        const ultimaActivitate = istArr[0] ? istArr[0].verificari : "Nicio activitate înregistrată.";
        
        const ultimaRevizie = istArr.find(i => i.revizie === true);
        let z = 0;
        let dataRevizieAfisata = "";
        
        if (ultimaRevizie) {
            z = calculeazaZile(ultimaRevizie.data);
            dataRevizieAfisata = ultimaRevizie.data;
        } else {
            z = 0; 
            dataRevizieAfisata = "0 ZILE (Nicio revizie raportată)";
        }
        
        let col = z < 30 ? "#2ecc71" : (z < 90 ? "#f39c12" : "#e74c3c");

        // --- 2. MODIFICĂM ICONIȚA (Adăugăm clasaPin) ---
        const m = L.marker([u.lat, u.lng], { 
            icon: L.divIcon({ 
                className: clasaPin, // Folosim variabila care decide dacă pinul e selectat
                html: `
                    <svg width="30" height="45" viewBox="0 0 30 45" xmlns="http://www.w3.org/2000/svg" 
                         style="filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3)); shape-rendering: geometricPrecision;">
                        <ellipse cx="15" cy="42" rx="7" ry="2" fill="rgba(0,0,0,0.15)" />
                        <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 30 15 30s15-19.5 15-30c0-8.3-6.7-15-15-15z" fill="${col}" stroke="#fff" stroke-width="0.5"/>
                        <circle cx="15" cy="15" r="5.5" fill="white"/>
                    </svg>
                `, 
                iconSize: [30, 45],
                iconAnchor: [15, 45], 
                popupAnchor: [0, -45] 
            }),
            // --- 3. ÎL ADUCEM ÎN FAȚĂ (Z-Index) ---
            zIndexOffset: esteSelectat ? 1000 : 0 
        }).addTo(map);

        m.bindPopup(`
            <div class="popup-header">
                <h3>${u.nume}</h3>
                <p style="margin: 0; font-weight: bold;">${u.marca || ''} ${u.model || ''}</p>
                <p>ID: ${u.id} | ${u.sectie}</p>
            </div>
            <div class="popup-body">
                <div class="last-info">
                    <b style="color:${col}; font-size:14px;">Zile de la revizie: ${z}</b><br>
                    <span style="color:#666; font-size:11px;">Ultima revizie oficială: ${dataRevizieAfisata}</span><br>
                    <span style="color:#666; font-size:11px;">Ultima intervenție: ${ultimaData}</span><br>
                    <i style="color:#444; margin-top:5px; display:block; padding:5px; background:#f8f9fa; border-radius:5px;">Activitate recentă: ${ultimaActivitate}</i>
                </div>
                <button class="btn-history" onclick="deschideHist('${id}')">📜 VEZI ISTORIC COMPLET</button>
            </div>
        `);
    
    
        m.uData = { id: String(u.id).toUpperCase(), n: u.nume.toUpperCase() };
        markersList.push(m);
    });
}
     window.zoomSectie = function(sectie) {
    // 1. Verificăm dacă s-a ales opțiunea "Toate"
    if (sectie === "Toate") {
        console.log("Resetare vedere hartă: Toate secțiile.");
        // Resetăm harta pe centru, la zoom-ul inițial
        map.setView([500, 700], 0.5); 
        return; // Oprim execuția aici, nu mai căutăm utilaje
    }

    console.log("Zoom pe sectia:", sectie);
    const bounds = [];
    
    if (typeof dbRaw === 'undefined' || !dbRaw) return;

    Object.values(dbRaw).forEach(u => {
        // Comparăm secția (ignorăm litere mari/mici și spații)
        if (u.sectie && u.sectie.trim().toLowerCase() === sectie.toLowerCase() && u.lat && u.lng) {
            bounds.push([u.lat, u.lng]);
        }
    });

    if (bounds.length > 0) {
        map.flyToBounds(bounds, { 
    padding: [100, 100], 
    duration: 1.5, // secunde - cât de repede să "zboare"
    easeLinearity: 0.25 
    });
    } else {

        alert("Nu există utilaje cu coordonate înregistrate în secția: " + sectie);
    }
};

    // 7. FUNCȚII DASHBOARD (Calculează bazat pe bifa de Revizie)
    function deschideRapoarte() {
        let ok=0, wr=0, cr=0, total=0;
        const cF = document.getElementById('corpFluxLive'); cF.innerHTML = ""; let fl = [];

        Object.values(dbRaw).forEach(u => {
            const ist = u.istoric ? Object.values(u.istoric).sort((a,b)=>calculeazaZile(a.data)-calculeazaZile(b.data)) : [];
            
            const ultimaRevizie = ist.find(i => i.revizie === true);
            let z = 0;
            if(ultimaRevizie) { z = calculeazaZile(ultimaRevizie.data); }

            if(z < 30) ok++; else if(z < 90) wr++; else cr++;
            
            if(u.istoric) Object.values(u.istoric).forEach(i => {
                total++; 
                const indicatorRev = i.revizie ? `<span style="color:#27ae60; font-weight:bold;">[REVIZIE]</span> ` : "";
                fl.push({d:i.data, n:u.nume, s:u.sectie, m:i.mecanic || "-", a: indicatorRev + (i.verificari || "")});
            });
        });

        document.getElementById('statOK').innerText = ok;
        document.getElementById('statAtentie').innerText = wr;
        document.getElementById('statCritic').innerText = cr;
        document.getElementById('totalInterventii').innerText = total;

        fl.sort((a,b)=>calculeazaZile(a.d)-calculeazaZile(b.d)).slice(0, 50).forEach(f => {
            cF.innerHTML += `<tr><td><b>${f.d}</b></td><td><b>${f.n}</b></td><td>${f.s}</td><td>${f.m}</td><td>${f.a}</td></tr>`;
        });
        
        document.getElementById('reportModal').style.display = "flex";
    }

    function printeazaQR() {
    let root = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
    let win = window.open('', '_blank');
    
    // Începem documentul pentru print
    let hContent = `
    <html>
    <head>
        <style>
            body { font-family: sans-serif; margin: 0; padding: 20px; }
            .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
            .qr-card { 
                border: 1px solid #000; 
                padding: 12px; 
                text-align: center; 
                border-radius: 10px; 
                page-break-inside: avoid; 
            }
            .utilaj-nume { font-size: 8px; font-weight: bold; display: block; margin-top: 5px; }
            .utilaj-model { font-size: 8px; color: #333; font-weight: 600; display: block; margin: 2px 0; }
            .utilaj-id { font-size: 8px; color: #666; }
        </style>
    </head>
    <body onload="window.print()">
        <div class="grid-container">`;

    Object.values(dbRaw).forEach(u => {
        const modelAfisat = u.model ? u.model.toUpperCase() : "---";
        
        hContent += `
            <div class="qr-card">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(root+'scan.html?id='+u.id)}">
                <span class="utilaj-nume">${u.nume.toUpperCase()}</span>
                <span class="utilaj-model">MODEL: ${modelAfisat}</span>
                <span class="utilaj-id">ID: ${u.id}</span>
            </div>`;
    });

    hContent += '</div></body></html>';
    win.document.write(hContent); 
    win.document.close();
}

    function verificaAlarmeMentenanta() {
    const alertList = document.getElementById('alert-list');
    const alertPanel = document.getElementById('alert-panel');
    alertList.innerHTML = ""; 
    let areAlerte = false;

    Object.values(dbRaw).forEach(u => {
        // Extragem ultimele 4 cifre din ID (ex: din "K-9728" scoatem "9728")
        const idScurt = u.id.split('-')[1]; 
        
        // Vedem dacă acest ID are un interval definit de noi mai sus
        let interval = configuratieAlarme[idScurt] || 0;

        if (interval > 0 && u.istoric) {
            const istArr = Object.values(u.istoric);
            
            // Căutăm ultima intervenție marcată ca REVIZIE (schimb cuțite)
            const ultimaRev = istArr
                .filter(i => i.revizie === true)
                .sort((a, b) => b.timestamp - a.timestamp)[0];

            if (ultimaRev) {
                const zileTrecute = calculeazaZile(ultimaRev.data);
                const zileRamase = interval - zileTrecute;

                // Atenționăm cu 3 zile înainte sau dacă a expirat deja
                if (zileRamase <= 3) {
                    areAlerte = true;
                    const tipAlerta = zileRamase <= 0 ? 'alert-urgent' : 'alert-warning';
                    
                    let statusMesaj = "";
                    if (zileRamase < 0) statusMesaj = `EXPIRAT DE ${Math.abs(zileRamase)} ZILE`;
                    else if (zileRamase === 0) statusMesaj = `EXPIRĂ AZI!`;
                    else statusMesaj = `Expiră în ${zileRamase} zile`;
                    const modelAfisat = u.model ? ` | Model: ${u.model}` : '';

alertList.innerHTML += `
    <div class="alert-item ${tipAlerta}">
        <div style="font-size:11px; opacity:0.8; margin-bottom: 2px;">
            ID: ${u.id}${modelAfisat}
        </div>
        <strong style="font-size: 14px;">${u.nume}</strong>
        
        <div style="color:${zileRamase <= 0 ? '#ff7675' : '#fdcb6e'}; font-weight: bold; margin: 4px 0; font-size: 13px;">
            ⚠️ ${statusMesaj}
        </div>
        
        <div style="font-size: 12px; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px;">
            🔪 Necesită înlocuire cuțite
        </div>

        <button class="btn-locate" onclick="focalizeazaUtilaj(${u.lat}, ${u.lng}, '${u.id}')">
    📍 VEZI PE HARTĂ
</button>
    </div>
`;
                }
            }
        }
    });

    if (areAlerte) {
        alertPanel.classList.remove('alert-hidden');
    } else {
        alertPanel.classList.add('alert-hidden');
    }
}
    // Definim intervalele pentru fiecare ID (ultimele 4 cifre)
    const configuratieAlarme = {
    "9728": 30, // K-9728 are interval de 30 zile
    "6355": 30, // K-6355 are interval de 30 zile
    "1111": 14, // Exemplu utilaj Tocare
    "2222": 14, // Exemplu utilaj Tocare
    "3333": 14, // Exemplu utilaj Tocare
    "4444": 14  // Exemplu utilaj Tocare
    };

    function focalizeazaUtilaj(lat, lng, id) {
    // 1. Setăm ID-ul selectat global (ca sistemul să știe pe cine să lumineze)
    selectedId = id;

    // 2. Redesenăm pinii (fără asta, pinul nu se va aprinde albastru)
    afiseazaPuncte();

    // 3. Zburăm către locație (flyTo este mai lin decât setView)
    map.flyTo([lat, lng], 2, {
        animate: true,
        duration: 1.5
    });
}
