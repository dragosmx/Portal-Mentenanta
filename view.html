<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBHfyZzJ-GUfUUqEidMytaCSh-B2SYh1Ks",
        authDomain: "killer-mentenanta.firebaseapp.com",
        databaseURL: "https://killer-mentenanta-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "killer-mentenanta",
        storageBucket: "killer-mentenanta.firebasestorage.app",
        messagingSenderId: "434460062600",
        appId: "1:434460062600:web:38a2ff00266c3c1dff403d"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let dbRaw = {};
    let selectedId = null;
    let markersList = [];
    let searchTimer = null;
    
    // VARIABILĂ GLOBALĂ PENTRU A ȚINE MINTE CĂ AI ÎNCHIS ALARMA
    let alertaInchisaManual = false; 
 
    function calculeazaZile(dataString) {
        if (!dataString || dataString === "-" || dataString.trim() === "") return 999;
        const curat = dataString.replace(/[^0-9./-]/g, '').trim();
        const part = curat.split(/[./-]/);
        if (part.length < 3) return 999;
        let d, m, y;
        if (part[0].length === 4) { [y, m, d] = part; } else { [d, m, y] = part; }
        const dt = new Date(y, m - 1, d);
        const azi = new Date(); azi.setHours(0,0,0,0);
        const diff = Math.floor((azi - dt) / 86400000);
        return isNaN(diff) ? 999 : (diff < 0 ? 0 : diff);
    }

    var map = L.map('map', { crs: L.CRS.Simple, minZoom: 0, maxZoom: 3, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.imageOverlay('harta.jpg', [[0, 0], [1000, 1400]]).addTo(map);
    map.setView([500, 700], 0.5);

    database.ref('utilaje').on('value', (snap) => {
        dbRaw = snap.val() || {};
        afiseazaPuncte();
        verificaAlarmeMentenanta();
        document.getElementById('loading-screen').style.display = 'none';
    });
    setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 4000);

    function afiseazaPuncte() {
        const filtru = document.getElementById('filterSectie').value;
        markersList.forEach(m => map.removeLayer(m)); 
        markersList = [];

        Object.keys(dbRaw).forEach(id => {
            const u = dbRaw[id];
            if (filtru !== "Toate" && u.sectie !== filtru) return;
            if (!u.lat || !u.lng) return;

            const esteSelectat = (id === selectedId);
            const clasaPin = esteSelectat ? 'custom-pin pin-selectat' : 'custom-pin';

            const istArr = u.istoric ? Object.values(u.istoric).sort((a,b)=>calculeazaZile(a.data)-calculeazaZile(b.data)) : [];
            const ultimaData = istArr[0] ? istArr[0].data : "-";
            const ultimaActivitate = istArr[0] ? istArr[0].verificari : "Nicio activitate înregistrată.";
            
            const ultimaRevizie = istArr.find(i => i.revizie === true);
            let z = 0; let dataRevizieAfisata = "";
            
            if (ultimaRevizie) { z = calculeazaZile(ultimaRevizie.data); dataRevizieAfisata = ultimaRevizie.data; } 
            else { z = 0; dataRevizieAfisata = "0 ZILE (Nicio revizie raportată)"; }
            
            let col = z < 30 ? "#2ecc71" : (z < 90 ? "#f39c12" : "#e74c3c");

            const m = L.marker([u.lat, u.lng], { 
                icon: L.divIcon({ 
                    className: clasaPin,
                    html: `<svg width="30" height="45" viewBox="0 0 30 45" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3)); shape-rendering: geometricPrecision;">
                            <ellipse cx="15" cy="42" rx="7" ry="2" fill="rgba(0,0,0,0.15)" />
                            <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 30 15 30s15-19.5 15-30c0-8.3-6.7-15-15-15z" fill="${col}" stroke="#fff" stroke-width="0.5"/>
                            <circle cx="15" cy="15" r="5.5" fill="white"/>
                        </svg>`, 
                    iconSize: [30, 45], iconAnchor: [15, 45], popupAnchor: [0, -45] 
                }),
                zIndexOffset: esteSelectat ? 1000 : 0 
            }).addTo(map);

            m.bindPopup(`
                <div class="popup-header">
                    <h3>${u.nume}</h3>
                    <p style="margin: 0; font-weight: bold;">${u.marca || ''} ${u.model || ''}</p>
                    <p>ID: ${u.id} | ${u.sectie}</p>
                </div>
                <div class="popup-body">
                    <div class="last-info">
                        <b style="color:${col}; font-size:14px;">Zile de la revizie: ${z}</b><br>
                        <span style="color:#666; font-size:11px;">Ultima revizie oficială: ${dataRevizieAfisata}</span><br>
                        <span style="color:#666; font-size:11px;">Ultima intervenție: ${ultimaData}</span><br>
                        <i style="color:#444; margin-top:5px; display:block; padding:5px; background:#f8f9fa; border-radius:5px;">Activitate recentă: ${ultimaActivitate}</i>
                    </div>
                    <button class="btn-history" onclick="deschideHist('${id}')">📜 VEZI ISTORIC COMPLET</button>
                </div>
            `);
            m.uData = { id: String(u.id).toUpperCase(), n: u.nume.toUpperCase() };
            markersList.push(m);
        });
    }

    window.zoomSectie = function(sectie) {
        if (sectie === "Toate") { map.setView([500, 700], 0.5); return; }
        const bounds = [];
        if (typeof dbRaw === 'undefined' || !dbRaw) return;
        Object.values(dbRaw).forEach(u => {
            if (u.sectie && u.sectie.trim().toLowerCase() === sectie.toLowerCase() && u.lat && u.lng) { bounds.push([u.lat, u.lng]); }
        });
        if (bounds.length > 0) { map.flyToBounds(bounds, { padding: [100, 100], duration: 1.5, easeLinearity: 0.25 }); } 
        else { alert("Nu există utilaje cu coordonate înregistrate în secția: " + sectie); }
    };

    function cautaSmart() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { cauta(); }, 300);
    }

    function inchideModal(idModal) {
        document.getElementById(idModal).style.display = 'none';
        document.getElementById(idModal).classList.remove('print-active');
    }

    function deschideRapoarte() {
        let ok=0, wr=0, cr=0, total=0;
        const cF = document.getElementById('corpFluxLive'); cF.innerHTML = ""; let fl = [];

        Object.values(dbRaw).forEach(u => {
            const ist = u.istoric ? Object.values(u.istoric).sort((a,b)=>calculeazaZile(a.data)-calculeazaZile(b.data)) : [];
            const ultimaRevizie = ist.find(i => i.revizie === true);
            let z = 0; if(ultimaRevizie) { z = calculeazaZile(ultimaRevizie.data); }

            if(z < 30) ok++; else if(z < 90) wr++; else cr++;
            
            if(u.istoric) Object.values(u.istoric).forEach(i => {
                total++; 
                const indicatorRev = i.revizie ? `<span style="color:#27ae60; font-weight:bold;">[REVIZIE]</span> ` : "";
                fl.push({d:i.data, n:u.nume, s:u.sectie, m:i.mecanic || "-", a: indicatorRev + (i.verificari || "")});
            });
        });

        document.getElementById('statOK').innerText = ok;
        document.getElementById('statAtentie').innerText = wr;
        document.getElementById('statCritic').innerText = cr;
        document.getElementById('totalInterventii').innerText = total;

        fl.sort((a,b)=>calculeazaZile(a.d)-calculeazaZile(b.d)).slice(0, 50).forEach(f => {
            cF.innerHTML += `<tr><td><b>${f.d}</b></td><td><b>${f.n}</b></td><td>${f.s}</td><td>${f.m}</td><td>${f.a}</td></tr>`;
        });
        document.getElementById('reportModal').style.display = "flex";
    }

    function deschideHist(id) {
        const u = dbRaw[id];
        document.getElementById('histNume').innerText = u.nume;
        document.getElementById('histModel').innerText = "Cod ID: " + u.id + " | Secție: " + u.sectie;
        const c = document.getElementById('corpIstoricIndividual'); c.innerHTML = "";
        
        document.querySelector('#historyModal table thead tr').innerHTML = `<th>Data</th><th>Mecanic</th><th>Operațiuni Efectuate</th><th>Observații</th><th>Foto</th>`;

        if (u.istoric) {
            Object.values(u.istoric).sort((a,b)=>calculeazaZile(a.data)-calculeazaZile(b.data)).forEach(i => {
                const indicatorRev = i.revizie ? `<span style="background:#27ae60; color:white; padding:3px 6px; border-radius:5px; font-size:10px;">REVIZIE</span> ` : "";
                const linkFoto = (i.foto && i.foto !== "") ? `<a href="${i.foto}" target="_blank" style="background:var(--primary); color:white; padding:5px 10px; border-radius:5px; text-decoration:none; font-size:11px; font-weight:bold;">📷 VEZI</a>` : "-";

                c.innerHTML += `<tr><td><b>${i.data}</b></td><td>${i.mecanic || '-'}</td><td>${indicatorRev} ${i.verificari}</td><td>${i.obs || '-'}</td><td>${linkFoto}</td></tr>`;
            });
        }
        document.getElementById('btnExcelIndv').onclick = () => exportaExcelUtilaj(id);
        document.getElementById('historyModal').style.display = "flex";
    }

    function printeazaElement(idModal) {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('print-active'));
        document.getElementById(idModal).classList.add('print-active');
        window.print();
        setTimeout(() => { document.getElementById(idModal).classList.remove('print-active'); }, 500);
    }

    function exportaTotExcel() {
        let rows = [];
        Object.values(dbRaw).forEach(u => {
            if(u.istoric) {
                Object.values(u.istoric).forEach(i => {
                    const rev = i.revizie ? "DA" : "NU";
                    rows.push({ "Dată": i.data, "Utilaj": u.nume, "Cod ID": u.id, "Secție": u.sectie, "Mecanic": i.mecanic || "-", "Revizie Generala": rev, "Operațiuni": i.verificari, "Obs": i.obs || "-" });
                });
            }
        });
        const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Raport"); XLSX.writeFile(wb, "Killer_Export_Total.xlsx");
    }

    function exportaExcelUtilaj(id) {
        const u = dbRaw[id]; let dExport = [];
        if(u.istoric) Object.values(u.istoric).forEach(i => { 
            const rev = i.revizie ? "DA" : "NU";
            dExport.push({ "Dată": i.data, "Mecanic": i.mecanic || "-", "A Fost Revizie?": rev, "Operațiuni": i.verificari, "Obs": i.obs || "-" }); 
        });
        const ws = XLSX.utils.json_to_sheet(dExport); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Fisa"); XLSX.writeFile(wb, `Fisa_${u.id}.xlsx`);
    }

    function printeazaQR() {
        let root = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);
        let win = window.open('', '_blank');
        let hContent = `<html><head><style>@page { size: portrait; margin: 10mm; } body { font-family: sans-serif; margin: 0; padding: 10px; background: #fff; } .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; } .qr-card { border: 1.5px solid #000; padding: 15px 10px; text-align: center; border-radius: 8px; page-break-inside: avoid; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; } .qr-card img { width: 130px; height: 130px; margin-bottom: 10px; } .utilaj-nume { font-size: 8px; font-weight: bold; display: block; margin-top: 5px; border-top: 1px solid #eee; padding-top: 5px; width: 100%; } .utilaj-model { font-size: 8px; color: #000; font-weight: bold; display: block; margin: 4px 0; } .utilaj-id { font-size: 6px; color: #444; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }</style></head><body onload="window.print()"><div class="grid-container">`;
        Object.values(dbRaw).forEach(u => {
            const modelAfisat = u.model ? u.model.toUpperCase() : "---";
            hContent += `<div class="qr-card"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(root+'scan.html?id='+u.id)}"><span class="utilaj-nume">${u.nume.toUpperCase()}</span><span class="utilaj-model">${modelAfisat}</span><span class="utilaj-id">ID: ${u.id}</span></div>`;
        });
        hContent += '</div></body></html>'; win.document.write(hContent); win.document.close();
    }

    function cauta() {
        const v = document.getElementById('searchInput').value.toUpperCase().trim();
        const m = markersList.find(x => x.uData.id.includes(v) || x.uData.n.includes(v));
        if (m) { map.setView(m.getLatLng(), 2); m.openPopup(); }
    }

    const configuratieAlarme = {
        "9728": 30, "6355": 30, "1111": 14, "2222": 14, "3333": 14, "4444": 14
    };

    function verificaAlarmeMentenanta() {
        const alertList = document.getElementById('alert-list');
        const alertPanel = document.getElementById('alert-panel');
        const btnClopotel = document.getElementById('btn-clopotel');
        alertList.innerHTML = ""; 
        let areAlerte = false;

        Object.values(dbRaw).forEach(u => {
            const idScurt = u.id.split('-')[1]; 
            let interval = configuratieAlarme[idScurt] || 0;

            if (interval > 0 && u.istoric) {
                const istArr = Object.values(u.istoric);
                const ultimaRev = istArr.filter(i => i.revizie === true).sort((a, b) => b.timestamp - a.timestamp)[0];

                if (ultimaRev) {
                    const zileTrecute = calculeazaZile(ultimaRev.data);
                    const zileRamase = interval - zileTrecute;

                    if (zileRamase <= 3) {
                        areAlerte = true;
                        const tipAlerta = zileRamase <= 0 ? 'alert-urgent' : 'alert-warning';
                        let statusMesaj = "";
                        if (zileRamase < 0) statusMesaj = `EXPIRAT DE ${Math.abs(zileRamase)} ZILE`;
                        else if (zileRamase === 0) statusMesaj = `EXPIRĂ AZI!`;
                        else statusMesaj = `Expiră în ${zileRamase} zile`;
                        
                        const modelAfisat = u.model ? ` | Model: ${u.model}` : '';

                        alertList.innerHTML += `
                        <div class="alert-item ${tipAlerta}">
                            <div style="font-size:11px; opacity:0.8; margin-bottom: 2px;">ID: ${u.id}${modelAfisat}</div>
                            <strong style="font-size: 14px;">${u.nume}</strong>
                            <div style="color:${zileRamase <= 0 ? '#ff7675' : '#fdcb6e'}; font-weight: bold; margin: 4px 0; font-size: 13px;">⚠️ ${statusMesaj}</div>
                            <div style="font-size: 12px; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px;">🔪 Necesită înlocuire cuțite</div>
                            <button class="btn-locate" onclick="focalizeazaUtilaj(${u.lat}, ${u.lng}, '${u.id}')">📍 VEZI PE HARTĂ</button>
                        </div>`;
                    }
                }
            }
        });

        // LOGICA DE AFIȘARE/ASCUNDERE BAZATĂ PE X
        if (areAlerte) {
            if (!alertaInchisaManual) {
                alertPanel.classList.remove('alert-hidden');
                alertPanel.classList.add('activ');
                btnClopotel.style.display = 'none'; // Ascundem clopoțelul dacă panoul e mare
            } else {
                alertPanel.classList.add('alert-hidden');
                alertPanel.classList.remove('activ');
                btnClopotel.style.display = 'flex'; // Arătăm clopoțelul pentru că l-ai ascuns manual
            }
        } else {
            alertPanel.classList.add('alert-hidden');
            alertPanel.classList.remove('activ');
            btnClopotel.style.display = 'none'; // Nu ai nicio alarmă, nu ai nevoie nici de clopoțel
        }
    }

    // Funcțiile atașate butoanelor "X" și "Clopoțel"
    function inchideAlarmaManual() {
        alertaInchisaManual = true; // Salvăm decizia ta
        document.getElementById('alert-panel').classList.add('alert-hidden');
        document.getElementById('btn-clopotel').style.display = 'flex';
    }

    function deschideAlarmaManual() {
        alertaInchisaManual = false; // Te-ai răzgândit
        document.getElementById('alert-panel').classList.remove('alert-hidden');
        document.getElementById('btn-clopotel').style.display = 'none';
        
        // Închidem și celelalte panouri de pe mobil (ex: panoul de căutare) dacă sunt deschise
        if(window.innerWidth <= 768) {
            document.querySelector('.panel').classList.remove('activ');
        }
    }

    function focalizeazaUtilaj(lat, lng, id) {
        selectedId = id; afiseazaPuncte();
        map.flyTo([lat, lng], 2, { animate: true, duration: 1.5 });
    }
    function printeazaQRIndividual() {
    // Luăm ID-ul utilajului care este deschis în History Modal
    const nume = document.getElementById('histNume').innerText;
    // Extragem ID-ul din textul de sub nume (care conține "Cod ID: K-XXXX...")
    const idFull = document.getElementById('histModel').innerText;
    const idMatch = idFull.match(/ID: ([^|]+)/);
    const id = idMatch ? idMatch[1].trim() : "";

    let root = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);

    win.document.write(`
        <html><body onload="window.print();window.close()" style="display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
            <div style="border:2px solid #000; padding:20px; text-align:center; border-radius:10px; width:200px;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(root+'scan.html?id='+id)}">
                <h2 style="font-family:sans-serif; margin:10px 0;">${nume}</h2>
                <p style="font-family:sans-serif; background:#eee;">ID: ${id}</p>
            </div>
        </body></html>
    `);
    win.document.close();
}
